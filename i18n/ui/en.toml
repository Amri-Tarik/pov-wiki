tiers = "A property counts with its tier's multiplier; one without a tier counts ×1. A rune bought with other dust than azurite dust is worth nothing here."
tier = "Tier"
mult = "Multiplier"
example = "What an item gives with properties of tier T3 (×1); uniques and legendaries at item level {level} (azurite + divine dust):"
props = "Properties"
magic = "Magic or rare"
unique = "Unique"
legendary = "Legendary"
jewels = "Unique jewels give dust by their item level instead: see [{title}]({link})."

[formula.jewel-dismantling]
jewel_link = "Dismantling it gives divine and azurite dust by its item level: see [{title}]({link})."
title = "Dismantling unique jewels"
text = "Dismantling a unique jewel gives divine dust and azurite dust by its item level:"
formula = "divine dust = {divine} × (1 + (item level − 1) ÷ {step}); azurite dust = {azurite} × (1 + (item level − 1) ÷ {step}); both rounded"
divine = "Divine dust"
azurite = "Azurite dust"
speed = "At the rune carver's table, each dismantle takes at most {s} s."

[formula.permadeath]
title = "Permadeath"
text = "The server setting Permadeath mode (off by default) makes death permanent in the ways chosen with its other settings, each off by default:"
items = "Permadeath: destroy all items: everything you carry and wear is destroyed, with no tombstone."
combat = "Permadeath: reset the combat tree: back to level 1 with no experience, only the start allocated."
craft = "Permadeath: reset the craft tree: all crafting progress is lost."
blink = "Permadeath: no Blink and Mirror creatures: creatures never get those two modifiers."
guard = "Permadeath: one-shot guard: a hit that would kill you and deals more than {share} of your maximum health leaves you at 1 health instead, at most once every {minutes} minutes of world time."
mercy = "Permadeath: right to a mistake: one death is forgiven and works like an ordinary death; the right comes back after {hours} hours of play."
