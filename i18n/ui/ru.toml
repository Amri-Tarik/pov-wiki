flat_shot = "плоский урон типа для выстрелов из лука или арбалета (как у колчана): только выстрелам из лука и арбалета, так же, как плоский урон этого типа"
oil = "Свой тип урона добавляют и {oil} оружия — до плоского урона, без множителя навыка."
