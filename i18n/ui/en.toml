one_handed = "{items}: compared with all of Valheim's one-handed weapons instead, the same way; its damage per quality level becomes that of the brand's biome."
shields = "shields: {block} and {force}, and their gain per quality level, become at least those of the biome's median shield of that kind."
staves = "summoning staves: the staff itself doesn't change, but its thralls are called as of the new biome ({strength})."
armour = "armour pieces (helmets, chest pieces, leg pieces and capes with armour): their {armour} and its gain per quality level become at least those of the biome's median piece of that slot."
