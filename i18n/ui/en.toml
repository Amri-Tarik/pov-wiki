[formula.ranged-falloff]
floors = "For scale: a {floor} is 2 m on a side, so {start} m is {start_n} floors in a row and {end} m is {end_n}."
title = "Effective range"
text = "{range}: a bow or crossbow shot deals full damage up to {start} m from where it was shot, then less the further it flies, down to × {floor} at {end} m and beyond. Thrown weapons and spells don't fall off."
formula = "damage factor = 1 − (distance − start) ÷ (end − start) × {drop}, between × {floor} and × 1; start = {start} m × range, end = {end} m × range"
notes = "Range is 1 + your shooting effective range increases (bow or crossbow ones count for that weapon), so +50% puts both distances 1.5 times as far. The factor multiplies the hit when it reaches the enemy, after the critical strike; flat damage against the enemy is added after it and isn't reduced."
distance = "Distance"
with = "+{x} range"

[formula.crossbow-magazine]
title = "Crossbow magazine"
text = "{crossbow} shoot from a magazine. Each {reload} (Valheim's reload, shortened by reload speed) fills it:"
capacity = "{loaded} = ⌊(1 + flat loaded bolts + additional projectiles + ⌊additional projectile chance⌋, +1 with the chance of what is left) × (1 + loaded bolt increases) × more⌋, rolled when the reload finishes"
rate = "time between shots = the crossbow's reload time × {share} ÷ ((1 + {rate} increases) × more)"
shots = "Each shot fires one bolt and uses one loaded shot; a shot that saves its ammo keeps it. When the magazine is empty, the crossbow reloads; the Reload key (R by default) reloads early whenever the magazine isn't full. The first shot after a reload and the last loaded shot are {position}: bonuses can name them."
crit = "Critical damage increases for the last loaded shot change how its [critical strike multiplier]({crit}) is built."
crossbow = "Crossbow"
reload_col = "Reload time"
interval = "Between shots"
per_second = "Shots per second"

[formula.ground-effects]
title = "Ground effects"
text = "{ground}: a passive that creates ground for a damage type ({nodes}) makes your spells leave a patch where they land: a projectile that hits the ground or an object (not one that hits an enemy), or an area spell where it strikes. One impact makes one patch, with a layer for each of the spell's fire, frost, lightning and poison damage that has such a passive."
layer = "Each layer comes from the spell's damage of its type, after your damage increases (ground damage increases join them) and before its critical strike:"
dps = "damage per second = {share} × that damage × your {dot} for the type"
build = "build-up per second = {share} × that damage, into burning, chill, shock or poison"
size = "A patch has a radius of {radius} m × (1 + area increases), at most {maxr} m, and lasts {life} s × (1 + effect duration increases), at most {maxl} s."
pay = "Enemies standing on it (on the ground, not swimming) take its damage every {tick} s, paid about once a second, through their resistances. Ground damage is never a critical strike, can't be blocked or evaded, and doesn't stagger. Each enemy takes only the strongest patch of each type, whoever made it; different types add up. Your allies and you take no damage from your patches."
limit = "You can keep {n} patch at once ({limit}); a new one past the limit removes your oldest. Only spell patches count."
chilled = "{chilled} makes everyone on it slide, you and your allies too. It doesn't lower speed: speeding up and braking work at {friction} of the usual rate, turning at {steering}."
standing = "Passives that work while you stand on a kind of ground count any patch of that type, yours or not."

[formula.infusion]
title = "Infusion"
text = "{infusion}: with {gather} and a staff in hand (elemental or blood magic), standing on your own spell patches absorbs them into a store, by damage type. A patch shrinks as it's absorbed and is gone below {min} m."
absorb = "units gained = {area} m² per second × (1 + absorption rate) ÷ {unit} m²"
absorb_notes = "Less is gained where your other patches of the same type already cover the patch's edge."
store = "The store holds at most {limit} units in all ({limits}). It empties {duration} s after the last gain, and when you die."
release = "Your next damaging spell cast by hand (or attack with {pious}) uses the whole store: each unit adds {per} of the damage of the spell that made the patch (that type, after its increases) × (1 + infusion potency), as flat damage of its type. A projectile spell splits it among its projectiles; an area spell adds all of it to every hit. Damage that came from infusion can't be absorbed again."
echo = "{echo} repeats infused projectile spells; infused area spells aren't repeated."

[formula.ascension]
damage = "Damage"
item_intro = "What each boss essence that can ascend this item makes of it, at quality 1 (in brackets: what each quality adds; ascending sets the quality back to 1, and an upgraded item keeps at least what it had). How it works: [{title}]({link})."
essence_link = "Ascends a weapon, shield or summoning staff to {biome} (item level {level}): see [{title}]({link})."
title = "Ascension"
text = "A boss essence ascends a weapon, a shield or a summoning staff to a later biome, once per item and only upward: the item's own biome (that of the highest-level material in its recipe; a staff's thrall's) must come before the essence's."
essence = "Essence"
how = "The item's base stats are compared with Valheim's own items of its kind from that biome (weapon kind and one- or two-handed, or kind of shield) and raised to their median; they never go down:"
weapons = "weapons: combat damage (everything but chopping and mining) rises to the median of that kind's weapons in the biome, keeping its damage types; so does damage per quality level. Kinds with no Valheim weapon in the biome, elemental staves and sceptres rise by how much weapon damage grows from biome to biome."
shields = "shields: {block} and {force}, and their gain per quality level, become at least those of the biome's median shield of that kind."
staves = "summoning staves: the staff itself doesn't change, but its thralls are called as of the new biome ({strength})."
durability = "{durability} and its gain per quality level become at least the biome's."
keeps = "An upgraded item keeps at least the damage, block, parry force and durability it had at its quality."
after = "The item goes back to quality 1, and upgrading it costs what the biome's reference item costs, at that item's station. Its item level rises to the biome's level. Properties, sockets and sigils stay. Corrupted and unidentified items can't ascend, nor pickaxes, bombs, traps, torches or weapons with less than {min} combat damage."
vanilla = "Valheim's own summoning staves can ascend only while the server setting Vanilla summoning staves is off."

[formula.dismantling]
title = "Dismantling into dust"
dust_link = "Dismantling magic and better items gives it: see [{title}]({link})."
text = "Magic, rare, unique and legendary items can be dismantled into dust at the rune carver's table (this is not {salvage}, which returns recipe materials). Each property of the item is worth the azurite dust price of a rune, by its place among the item's properties; an item with no properties counts as one:"
