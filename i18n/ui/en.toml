reward = "Reward"
danger = "Danger"
see_rooms = "See also [room items]({link})."
on_map_title = "On a map of the halls"
on_map_more = "See [map modifiers]({link})."
renew_back = "In the Halls of Oaths it renews the stock of the room merchant {merchant}."
reward_back = "A reward of the unique room {rooms} in the Halls of Oaths."
bosses_back = "Every biome boss also has a [boss room]({rooms}) for the [Halls of Oaths]({halls}), where it can be fought as a map's final boss."

