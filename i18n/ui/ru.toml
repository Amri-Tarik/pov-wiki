formula = "{base} + бонусы критического урона, не меньше 0"
notes = "Бонусы состоят из частей, каждая — плоские бонусы × (1 + увеличения): общие, для вида вашего оружия, для цели и для альтернативной атаки. Части считаются отдельно и складываются, поэтому общее «уменьшение критического урона» не снижает собственный бонус оружия."

[formula.crit-chance]
title = "Шанс критического удара"
text = "Шанс критического удара начинается с базы оружия:"
formula = "шанс = (база + плоский) × (1 + увеличения) × больше, не выше максимума"
bases = "База: ножи {knives}, древковое {polearms}, остальное оружие {other}, заклинания {spells}. Собственные свойства шанса крита на оружии применяются к его базе первыми. Максимум по умолчанию {ceiling}."

[formula.evasion]
title = "Уклонение"
text = "{evade} даёт шанс избежать удара. Он зависит от меткости атакующего ({accuracy}), которая растёт с его уровнем и звёздами:"
accuracy = "меткость = ({base} + {per} × уровень) × (1 + {star} × звёзды)"
chance = "шанс уклонения = 1 − {h} × меткость ÷ (меткость + уклонение), не больше {cap}"
notes = "Уклонение — не бросок кубика на каждый удар: удары уклоняются в ровном ритме, так что за много ударов доля уклонённых равна шансу. От периодического урона по площади уклониться нельзя. Шанс против существ без звёзд по биомам:"
acc_col = "Меткость"
rating_col = "Уклонение {n}"

[formula.resistances]
title = "Сопротивления"
text = "{term} уменьшают урон своего типа: урон × (1 − сопротивление)."
formula = "сопротивление = min(предел, ваше сопротивление − пробивание врага);   предел = {cap} + максимум сопротивления, не больше {hard}"
notes = "Огонь, холод и молния учитывают ещё и стихийное сопротивление. Пробивание может опустить сопротивление ниже нуля, и тогда получаемый урон растёт."

[formula.enemy-penetration]
title = "Пробивание врагов"
text = "Существа пробивают вашу защиту по своему биому: у них есть {armour} (плоское) и {resist} (доля ваших сопротивлений). Против ударов существ ваша броня считается как {effect}."
notes = "Боссы сдвигаются к значениям следующего биома. Существа с модификатором {piercing} игнорируют больше."

[formula.strikes]
title = "Дополнительные страйки"
text = "{strike}: горизонтальный или вертикальный взмах оружия ближнего боя, основной или альтернативный; удары по земле и скипетры не считаются. Когда взмах попадает по врагу, он бьёт ещё столько раз, сколько у вас дополнительных страйков, по одному каждые {interval} с. Каждый идёт в ближайшего ещё не задетого врага в пределах {radius} м от первой цели и {reach} м от вас; когда таких нет, страйки прекращаются."
formula = "дополнительные страйки = ⌊дополнительные страйки⌋, ×2 один раз после критического удара ({double})"
hits = "Каждый дополнительный страйк — новое попадание той же атаки: он сам бросает критический удар и получает все ваши бонусы к урону. Бонусы страйков действуют и на взмах, и на каждый дополнительный страйк."
double = "С «{double}» первый критический удар атаки — взмаха или одного из её страйков — удваивает её дополнительные страйки, один раз за атаку."
focus = "С «{focus}» все дополнительные страйки бьют первую цель, по {pct} урона каждый, и прекращаются, если она умирает или уходит из досягаемости."
combo = "{combo} считает одно попадание за атаку: дополнительные страйки и фантомные удары её не увеличивают."

[formula.phantom-strikes]
title = "Фантомные удары"
text = "{phantom} могут следовать за попаданием атаки ближнего боя: самим ударом оружия или одним из его дополнительных страйков, но не снарядами, ударами по области и другими копиями. Каждый бьёт случайного врага в пределах {radius} м от задетого, включая его самого: первый через {delay} с после попадания, затем по одному каждые {interval} с."
count = "фантомных ударов за попадание = ⌊шанс⌋, +1 с вероятностью остатка"
formula = "урон фантомного удара = {share} × урон попадания"
damage = "Урон попадания берётся после его критического удара и всех ваших бонусов к урону, до брони и сопротивлений врага. Фантомный удар не получает ваших бонусов и не бывает критическим; броня и сопротивления врага действуют на него как обычно."
chain = "С {recursion} попавший фантомный удар может вызвать новые: шанс n-го поколения — шанс первого × множитель из его строки в степени n − 1. Одновременно ждут не больше {max} фантомных ударов."

[formula.build-cost]
title = "Стоимость строительства"
text = "Снижение стоимости строительства уменьшает каждый материал постройки, включая [постройки]({buildings}) мода, не больше чем на {cap}:"
formula = "стоимость = ⌈количество × (1 − снижение)⌉,   снижение не больше {cap}"
notes = "Разборка возвращает только то, что было заплачено. Если {refund} сохранил материалы поставленной постройки, разборка не даёт ничего."

[formula.armour]
title = "Броня"
text = "{term} работает как в Valheim: уменьшает удар на одну и ту же долю для всех его типов урона, сильно против слабых ударов и слабее против сильных. Где урон удара — сумма его типов урона:"
formula = "броня < урон ÷ 2:   получено = урон − броня;     иначе:   получено = урон² ÷ (4 × броня)"
effective = "броня против существ = ваша броня × {effect} − пробивание брони существа"
notes = "Броня действует после рунного щита и блока. Существа игнорируют её часть: см. [пробивание врагов]({pen}). Получаемый урон по броне и удару:"
armour_col = "Броня"
hit_col = "Удар {n}"

[formula.item-level]
title = "Уровень предмета"
text = "Выпавший предмет получает уровень существа, с которого выпал, или биома сундука ([уровни областей]({areas}))."
crafted = "Уровень созданного предмета — наибольший уровень среди его материалов, по биому, откуда они; материалы, нужные рецепту только для улучшений, не считаются. Формы считаются Глубоким Севером, идолы — биомом своего уровня (ниже). У каждого [базового предмета]({bases}) указан свой. Этот уровень используется, когда руны добавляют предмету свойства: каждая руна задаёт его заново по рецепту."
gates = "Уровень предмета определяет, какие [свойства]({mods}) и ступени могут выпасть (у каждой ступени свой диапазон уровней), насколько редкой будет добыча и какие [уникальные предметы]({uniques}) могут выпасть."
idols = "Каким уровнем считается каждый идол улучшения:"
idol_col = "Идол"

[formula.experience-falloff]
title = "Угасание опыта"
text = "За пределами рекомендуемого диапазона биома боевой опыт, полученный там, угасает. Диапазоны следуют рекомендуемым уровням игрока (настройка сервера, по умолчанию — уровни биомов). Считается ваш уровень; биом — там, где умирает существо (для убийств) или где стоите вы (для ударов). Быть ниже уровня биома ничего не стоит."
formula = "остаётся = max({floor}, {floor} ^ (уровней за диапазоном ÷ {gap}))"
notes = "Опыт угасает до {floor} через {gap} уровней за диапазоном и ниже не опускается:"
over_col = "Уровней за диапазоном"
share_col = "Остаётся опыта"
full_col = "Полный опыт"
floor_col = "{floor} с уровня"

[formula.player-levels]
title = "Уровень персонажа"
text = "Боевой опыт поднимает уровень персонажа, до {max}. Каждый уровень требует:"
formula = "опыт до следующего уровня = {base} × уровень ^ {exp}, с округлением"
next_col = "До следующего уровня"
total_col = "Всего до уровня"
points = "Каждый уровень даёт {points} очко пассивных навыков; очки приходят и из других источников."
death = "При смерти вы теряете {death} опыта уровня ({term}), но не опускаетесь ниже начала своего уровня. Пассивные навыки могут уменьшить потерю."

[gear.rift]
title = "Как это работает"
targets = "При выпадении его свойство указывает на один из порталов древа, выбранный случайно:"
hidden = "обычно открыт только классу возвышения «{classes}»"
text = "В распределённом гнезде (после опознания) он превращает скрытый узел рядом с гнездом в портал — Разлом Ока. Как и любой портал, разлом соединён со всеми остальными, так что путь можно продолжить оттуда. Портал, на который он указывает, тоже открывается, даже без своего класса возвышения. Если вынуть самоцвет, разлом закрывается, а этот портал снимается, если снова оказывается скрытым."

