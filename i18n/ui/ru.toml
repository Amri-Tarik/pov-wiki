[formula.held-eitr]
title = "Удерживаемый эйтр"
text = "{eitr}, который держит призванный, вычитается из вашего максимума эйтра, пока он жив, а эйтр сверх нового максимума теряется."
formula = "удерживаемый эйтр = база × (1 + {q} × (качество посоха − 1)) ÷ (1 + эффективность резервирования для приспешников)"
notes = "Делитель не меньше {floor}: +100% эффективности резервирования вдвое уменьшает удерживаемое, −20% — увеличивает на 25%. Удержание заканчивается, когда призванный умирает или кончается его время жизни, и возвращается, если вы входите в игру, пока ваши призванные живы."
short = "Посох призыва не вызовет раба, если у вас нет столько свободного эйтра. Посохи Valheim тогда вообще не применяются."

[formula.summon-lifetime]
title = "Время жизни и увядание"
text = "Призванные живут ограниченное время и увядают: их здоровье не может быть выше оставшейся доли времени жизни."
formula = "время жизни = базовое время жизни × ваша длительность эффектов для приспешников"
wither = "здоровье не больше = максимум здоровья × (1 − прожитое время ÷ время жизни), не меньше 1"
notes = "Когда время жизни кончается, призванный уходит. Его время идёт по часам мира, так что идёт и пока вас нет."
