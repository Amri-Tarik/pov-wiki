[formula.player-penetration]
title = "Ваше пробивание"
text = "Valheim даёт каждому существу ступень сопротивления против каждого типа урона. Ваше {pen} против огня, холода, молнии и яда (стихийное пробивание считается для первых трёх) добавляется к доле урона, которая проходит:"
