[formula.permadeath]
title = "Permadeath"
text = "The server setting Permadeath mode (off by default) makes death permanent in the ways chosen with its other settings, each off by default:"
items = "Permadeath: destroy all items: everything you carry and wear is destroyed, with no tombstone."
combat = "Permadeath: reset the combat tree: back to level 1 with no experience, only the start allocated."
craft = "Permadeath: reset the craft tree: all crafting progress is lost."
blink = "Permadeath: no Blink and Mirror creatures: creatures never get those two modifiers."
guard = "Permadeath: one-shot guard: a hit that would kill you and deals more than {share} of your maximum health leaves you at 1 health instead, at most once every {minutes} minutes of world time."
mercy = "Permadeath: right to a mistake: one death is forgiven and works like an ordinary death; the right comes back after {hours} hours of play."
halls = "A death in the halls is spared: none of these settings apply to it, it doesn't use up the right to a mistake, and you lose no experience or skill levels for it."

