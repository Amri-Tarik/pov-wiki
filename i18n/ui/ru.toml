[formula.ranged-falloff]
floors = "Для масштаба: «{piece}» — 2 м в длину, так что {bstart} м и {bend} м — это {bstart_n} и {bend_n} таких пола в ряд."
title = "Эффективная дальность"
text = "{range}: выстрел из лука наносит полный урон до начального расстояния в {bstart} м от места выстрела, а дальше — тем меньше, чем дальше летит: × {mid} на {bmid} м ({share} пути до конечного расстояния) и × {floor} на конечном расстоянии в {bend} м и дальше. Арбалеты, метательное оружие и заклинания не ослабевают: они наносят полный урон на любом расстоянии."
formula = "множитель урона: × 1 в начале, по прямой до × {mid} в точке начало + {share} × (конец − начало), затем по прямой до × {floor} в конце; начало и конец × дальность"
notes = "Дальность — это 1 + ваши увеличения эффективной дальности стрельбы и луков, так что +50% отодвигает оба расстояния в 1,5 раза. Множитель действует на удар, когда тот достигает врага, после критического удара; плоский урон против врага добавляется позже и не уменьшается."
distance = "Расстояние"
with = "+{x} дальности"

[formula.crossbow-magazine]
title = "Магазин арбалета"
text = "{crossbow} стреляют из магазина. Каждая {reload} (перезарядка Valheim, ускоренная скоростью перезарядки) заполняет его:"
capacity = "{loaded} = ⌊(1 + плоские заряженные болты + дополнительные снаряды + ⌊шанс дополнительного снаряда⌋, +1 с шансом остатка) × (1 + увеличения заряженных болтов) × больше⌋, бросается по окончании перезарядки"
rate = "время между выстрелами = время перезарядки арбалета × {share} ÷ ((1 + увеличения: {rate}) × больше)"
shots = "Каждый выстрел выпускает один болт и тратит один заряженный выстрел; выстрел, сохранивший боеприпас, сохраняет и его. Когда магазин пуст, арбалет перезаряжается; клавиша перезарядки (по умолчанию R) перезаряжает раньше, если магазин не полон. Первый выстрел после перезарядки и последний заряженный — это {position}: бонусы могут называть их."
crit = "Увеличения критического урона для последнего заряженного выстрела меняют то, как строится его [множитель критического удара]({crit})."
crossbow = "Арбалет"
reload_col = "Перезарядка"
interval = "Между выстрелами"
per_second = "Выстрелов в секунду"

[formula.ground-effects]
title = "Эффекты земли"
text = "{ground}: пассивка, создающая землю для типа урона ({nodes}), заставляет ваши заклинания оставлять участок там, куда они попали: снаряд, попавший в землю или предмет (не во врага), или заклинание по площади там, куда оно бьёт. Одно попадание создаёт один участок, со слоем для каждого из огня, мороза, молнии и яда заклинания, для которого есть такая пассивка."
layer = "Каждый слой берётся из урона заклинания своего типа после ваших увеличений урона (к ним добавляются увеличения урона земли) и до его критического удара:"
dps = "урон в секунду = {share} × этот урон × ваш {dot} для этого типа"
build = "накопление в секунду = {share} × этот урон, в горение, холод, шок или отравление"
size = "Радиус участка — {radius} м × (1 + увеличения площади; участок заклинания берёт и увеличения площади заклинаний), не больше {maxr} м; он держится {life} с × (1 + увеличения длительности эффектов), не больше {maxl} с."
pay = "Враги, стоящие на нём (на земле, не в воде), получают его урон каждые {tick} с, начисляемый примерно раз в секунду, с учётом их сопротивлений. Урон земли никогда не бывает критическим, его нельзя заблокировать или избежать уклонением, и он не оглушает. Каждый враг получает урон только от сильнейшего участка каждого типа, чей бы он ни был; разные типы складываются. Ваши союзники и вы сами от ваших участков урона не получаете."
limit = "Одновременно можно держать {n} участок ({limit}); новый сверх предела убирает ваш самый старый. Считаются только участки от заклинаний."
chilled = "{chilled}: все, кто на нём стоит, скользят, включая вас и ваших союзников. Скорость не снижается: разгон и торможение идут с {friction} обычной силы, повороты — с {steering}."
standing = "Пассивки, работающие, пока вы стоите на земле определённого вида, учитывают любой участок этого типа, ваш или нет."

[formula.infusion]
title = "Насыщение"
text = "{infusion}: с мастерством {gather} и посохом в руках (стихийной или кровавой магии) вы поглощаете свои участки от заклинаний, стоя на них, в запас по типам урона. Поглощаемый участок сжимается и исчезает, когда меньше {min} м."
absorb = "получено единиц = {area} м² в секунду × (1 + скорость поглощения для насыщения) ÷ {unit} м²"
absorb_notes = "Получается меньше там, где край участка уже накрыт другими вашими участками того же типа."
store = "Запас вмещает не больше {limit} единиц всего ({limits}). Он пустеет через {duration} с после последнего пополнения и при смерти."
release = "Ваше следующее атакующее заклинание, применённое вручную (или атака предметом {pious}), расходует весь запас: каждая единица добавляет {per} урона заклинания, создавшего участок (того же типа, после его увеличений), × (1 + сила насыщения), как плоский урон своего типа. Заклинание-снаряд делит его между снарядами; заклинание по площади добавляет весь запас к каждому удару. Урон от насыщения нельзя поглотить снова."
echo = "{echo} повторяет насыщенные заклинания-снаряды; насыщенные заклинания по площади не повторяются."

[formula.ascension]
