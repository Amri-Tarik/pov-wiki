[enchant]
title = "Enchantments"
all = "All enchantments"
scrolls_title = "Enchantment scrolls"
intro = "Enchantments are properties you choose and put on an item yourself, at the Runecarver Table. You open them by reading [scrolls]({scrolls}). Each enchantment has five tiers, from T5 (the weakest) to T1, and some also have a special T0."
how = "How enchanting works"
how_learn = "Enchanting is done in the {tab} tab of the {table}. Only the tiers your character has opened with [scrolls]({scrolls}) can be used. What a character learns stays with that character."
how_one = "An item holds one enchantment. It takes a free prefix or suffix place, as many as the item's rarity allows. A plain item counts as magic for this and becomes magic once enchanted. It can't be a kind of property the item already has. The tooltip shows it lighter than ordinary properties."
how_any_level = "Any opened tier goes on an item of any level: the opened tier is the only requirement."
how_not = "Unique items, special jewels, unidentified items and corrupted items can't be enchanted."
how_roll = "The value rolls within the tier's range. Like any [item mod]({mods}), a property that scales with the item slot is multiplied by the slot multiplier."
how_remove = "The table's remove button takes {n} {dust} and removes the enchantment together with its property. Anything else that takes the property away removes the enchantment too: forging at the {anvil} (unless the property is kept) and the glyphs that remove properties ({glyphs})."
how_seal = "{seal} seals one random property of a rare item that has a full set of properties and no influence. If it seals the enchanted property, that property stays on as an ordinary sealed property and the item counts as unenchanted. A new enchantment can then go on once a prefix or suffix place is free."
