both = "Увеличения и множители «больше», которым нужны удар и враг вместе."
physical = "{brk} добавляет к физическому урону удара, а {impale} его умножает."
resist = "Valheim применяет сопротивления существа; для огня, холода, молнии и яда действует {pen}."
