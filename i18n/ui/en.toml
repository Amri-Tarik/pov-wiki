text = "{ground}: a passive that creates ground for a damage type ({nodes}) makes your spells leave a patch where they land: a projectile that hits the ground or an object (not one that hits an enemy), or an area spell where it strikes. One impact makes one patch, with a layer for each of the spell's fire, frost, lightning and poison damage that has such a passive."
layer = "Each layer comes from the spell's damage of its type, after your damage increases (ground damage increases join them) and before its critical strike:"
dps = "damage per second = {share} × that damage × your {dot} for the type"
build = "build-up per second = {share} × that damage, into burning, chill, shock or poison"
size = "A patch has a radius of {radius} m × (1 + area increases; a spell's patch also takes spell area increases), at most {maxr} m, and lasts {life} s × (1 + effect duration increases), at most {maxl} s."
pay = "Enemies standing on it (on the ground, not swimming) take its damage every {tick} s, paid about once a second, through their resistances. Ground damage is never a critical strike, can't be blocked or evaded, and doesn't stagger. Each enemy takes only the strongest patch of each type, whoever made it; different types add up. Your allies and you take no damage from your patches."
limit = "You can keep {n} patch at once ({limit}); a new one past the limit removes your oldest. Only spell patches count."
chilled = "{chilled} makes everyone on it slide, you and your allies too. It doesn't lower speed: speeding up and braking work at {friction} of the usual rate, turning at {steering}."
standing = "Passives that work while you stand on a kind of ground count any patch of that type, yours or not."

