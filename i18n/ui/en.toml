durability = "{durability} and its gain per quality level become at least the biome's."
keeps = "An upgraded item keeps at least the damage, block, parry force, armour and durability it had at its quality."
after = "A weapon, shield, armour piece or staff goes back to quality 1, and upgrading it costs what the biome's reference item costs, at that item's station. Every ascended item's item level rises to the biome's level. Properties, sockets and sigils stay. Corrupted and unidentified items and jewels can't ascend."
vanilla = "Valheim's own summoning staves ascend as summoning staves only while the server setting Vanilla summoning staves is off; while it's on, they ascend like any other weapon and their summons don't change."

