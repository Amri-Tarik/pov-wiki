name: Build and deploy wiki

# Manual only until `povwiki fetch` exists (CI has no mod files to extract otherwise).
# Then add: push to main + a schedule that rebuilds when a new mod version is out.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run povwiki fetch
      - run: uv run povwiki extract .cache/latest.zip
      - run: uv run povwiki build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
