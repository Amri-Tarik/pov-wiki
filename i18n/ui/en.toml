[runic]
title = "Runic Crafting"
forging = "Runic Forging"
anvil = "Runic Anvil"
ores = "Special Ores"
alloys = "Alloys"
glyphs = "Glyphs"
intro = "At the {anvil} a piece of equipment is reworked with alloys and glyphs. Every action spends the item's {potential} and azurite dust. Without a main glyph an action forges the item anew; [alloys]({alloys}) steer which properties it gets, [glyphs]({glyphs}) change the item or the rules of the action. Alloys are smelted from [special ores]({ores})."
at_anvil = "The anvil"
anvil_text = "The {anvil} is built with the hammer near a workbench. Its stages open slots for alloys and glyphs ({slots}); {vise} adds one of your own, up to {max} in all."
stock = "Its stock keeps alloys, glyphs, azurite dust and divine dust, one slot each with no limit: Ctrl+click moves one between the stock and the slots. Several players can use one anvil at once and see each other's choices."
potential_title = "Potential"
potential_text = "{potential}: every piece of equipment that can have a rarity has {n} at most, whatever its rarity; an item never worked at the anvil has it all. The prefix [{mod}]({link}) raises the most: {n} × (1 + increase), rounded. The item remembers how much it has spent, so what is left follows the most when that prefix comes, goes or changes. Unique items, jewels other than base jewels, runes and items of fixed rarity have none. The item must be identified and not corrupted. Nothing restores spent potential."
forge_title = "Forging"
forge_text = "An action without a main glyph forges the item: every prefix and suffix is replaced and the item becomes rare ({rarity}) with {pre} prefixes and {suf} suffixes. A sealed property stays. The properties that fit the item must be enough for a full forging. Alloys work only here."
refused_title = "What is refused"
refused_text = "The anvil checks an action before anything is paid. When one of these applies, the action is refused with its reason and nothing is spent:"
phantom_title = "Phantom socket"
phantom_text = "The {glyph} may open a {term} beyond the item's usual limit of {sockets}. It takes what an ordinary socket takes and stays through punches, reforging and repairs."
tree_title = "On the craft tree"
tree_text = "The Runecarver's nodes and masteries for runic crafting:"
runic-cost_title = "Cost of an action"
cost_text = "Every action at the anvil costs {base} {potential} plus the potential of each alloy and glyph in it, and {dust} {azurite} plus each one's dust; valuable and very valuable glyphs also take {divine}. Dust comes from the anvil's stock first and the rest from your bag; alloys and glyphs come from the stock."
cost_text_free = "Every action at the anvil costs {base} {potential} plus the potential of each glyph in it (alloys cost none), and {dust} {azurite} plus each alloy's and glyph's dust; valuable and very valuable glyphs also take {divine}. Dust comes from the anvil's stock first and the rest from your bag; alloys and glyphs come from the stock."
cost_formula = "cost = max(1, ⌈({base} + alloys and glyphs) × (1 − reduced cost)⌉), reduced cost at most {cap}<br>critical craft = ⌈cost ÷ 2⌉"
cost_text_glyphs = "An action at the anvil costs only the {potential} of the glyphs in it: alloys cost none, and an action with no glyph costs no potential. It also costs {dust} {azurite} plus each alloy's and glyph's dust; valuable and very valuable glyphs also take {divine}. Dust comes from the anvil's stock first and the rest from your bag; alloys and glyphs come from the stock."
cost_formula_glyphs = "cost = ⌈glyphs × (1 − reduced cost)⌉, reduced cost at most {cap}<br>critical craft = ⌈cost ÷ 2⌉"
cost_crit = "A critical craft costs half the potential, rounded up. Its chance is {crit}, plus the runic crafting nodes of the [craft tree]({tree}), which also reduce the cost."
cost_delay = "With the {glyph}, {delay} of actions spend no potential at all; the critical craft is rolled only when that fails. Dust and the alloys and glyphs are spent either way."
cost_afford = "An action needs its whole cost still left on the item. With {touch} any potential left is enough, and the item ends at zero. At zero, runic crafting is closed; the item keeps working."
cost_sum = "Alloys and glyphs (potential)"
cost_normal = "Cost"
cost_critical = "Critical craft"
cost_actions = "Actions from full potential"
runic-alloys_title = "How alloys weight the roll"
alloys_text = "Each [alloy]({alloys}) favours the properties of its theme. For the item on the anvil the game takes the share s of the forge pool's weight those properties hold, and multiplies their weight so that they come to about {target} of the rolls:"
alloys_formula = "× = {target} × (1 − s) ÷ ({rest} × s), at least ×{min}, at most ×{max}"
alloys_share = "Theme's share of the pool"
alloys_mult = "Multiplier"
alloys_after = "Share with the alloy"
alloys_several = "A property in the themes of several alloys adds their multipliers: 1 + (×₁ − 1) + (×₂ − 1)…, so at least ×{two} with two alloys and ×{three} with three (×{min} each)."
alloys_depths = "{glyph}: properties of weight {weight} or less, the rare ones, are ×{x} as likely, on top of the alloys."
alloys_none = "An alloy with no property for this item cannot be used: the anvil says so and nothing is spent. The Forge button's tooltip shows each alloy's share before and after."
runic-glyphs_title = "Glyph rules"
glyphs_text = "One main glyph per action replaces forging with its own change. Support glyphs change how an action rolls or what it costs:"
main = "Main"
support = "Support"
instead_of_forging = "instead of forging"
