jewel = "Самоцветы"
by_level = "Редкость по уровню предмета"
by_level_note = "Снаряжение никогда не выпадает обычным: оно волшебное или редкое, по этим весам, которые редкость сдвигает к редкому. Базовые самоцветы могут выпасть и обычными, с весом {white} от веса волшебного (после редкости):"
curve = "c = редкость ÷ (1 + редкость);   волшебный × (1 + c),   редкий × (1 + 2c)"
common = "Обычный"
magic = "Волшебный"
rare = "Редкий"
unique = "Каждый выпавший предмет снаряжения с шансом {chance} × (1 + c) оказывается уникальным. С боссов всегда выпадает хотя бы волшебный предмет, с уровня {level} — редкий."
gear = "Снаряжение"
currency = "Валюта"
gates = "По умолчанию снаряжение выпадает, только когда вам известен его рецепт (все материалы); у валюты, самоцветов и уникальных предметов такого ограничения нет. Сервер может отключить каждый вид по источнику (враги, боссы, сундуки) и изменить их частоту."

[formula.vanilla-drops]
title = "Добыча Valheim"
text = "Обычная добыча Valheim (мясо, шкуры...) растёт со звёздами; трофеи и одиночные предметы — нет."
formula = "количество × (1 + {s} × звёзды), не больше {cap}"

[formula.experience]
title = "Опыт"
text = "Опыт за убийство:"
formula = "Опыт = базовое здоровье × {h} × (1 + {s} × звёзды + {m} × модификаторы)"
notes = "Базовое здоровье — здоровье вида в Valheim. Опыт делится между живыми игроками в пределах {radius} м (для боссов — в {boss} раза дальше). Ночью любой опыт +{night}. Существа рунного события дают {event}."
sources = "Уровень персонажа растёт только от боя: убийства и удары боевых навыков. Всё мирное (сбор, строительство, ремесло, исследование, путешествия) идёт в {craft} и никогда не урезается [угасанием опыта]({falloff})."

[formula.attributes]
title = "Атрибуты"
text = "Каждое очко атрибута даёт:"
attribute = "Атрибут"
per_point = "За очко"
per_hundred = "За 100 очков"
increased = "{x} увеличение: {term}"
increased_regen = "{x} увеличение регенерации: {term}"
plus = "+{x}: {term}"
skill = "Оружие, которым управляют атрибуты, умножает свой урон на случайный {factor}, заново выбираемый для каждого попадания между его серединой − {spread} и + {spread}, не ниже 0. Середина растёт с очками управляющих атрибутов оружия (если их два — их среднее); уровень навыка оружия самого Valheim не учитывается."
formula = "середина = {center} × (1 + {coef} × (очки ÷ {full})^0.75)"
points = "Очки"
midpoint = "Середина"
governing = "Управляющие атрибуты по навыкам оружия:"
weapon = "Навык оружия"
governs = "Управляющие атрибуты"
scepters = "Скипетрами управляют {str} и {int}, каким бы ни был их навык."
shifted = "С «{mastery}» {pct} вашей характеристики «{str}» также считается как «{dex}» для двуручного оружия и луков (кроме кастетов)."

[formula.crit-multiplier]
title = "Урон критического удара"
text = "{term} умножает урон удара на:"
formula = "{base} + бонусы критического урона, не меньше 0"
notes = "Бонусы состоят из частей, каждая — плоские бонусы × (1 + увеличения): общие, для вида вашего оружия, для цели и для альтернативной атаки. Части считаются отдельно и складываются, поэтому общее «уменьшение критического урона» не снижает собственный бонус оружия."

[formula.crit-chance]
title = "Шанс критического удара"
text = "Шанс критического удара начинается с базы оружия:"
formula = "шанс = (база + плоский) × (1 + увеличения) × больше, не выше максимума"
bases = "База: ножи {knives}, древковое {polearms}, остальное оружие {other}, заклинания {spells}. Собственные свойства шанса крита на оружии применяются к его базе первыми. Максимум по умолчанию {ceiling}."

[formula.evasion]
title = "Уклонение"
text = "{evade} даёт шанс избежать удара. Он зависит от меткости атакующего ({accuracy}), которая растёт с его уровнем и звёздами:"
accuracy = "меткость = ({base} + {per} × уровень) × (1 + {star} × звёзды)"
chance = "шанс уклонения = 1 − {h} × меткость ÷ (меткость + уклонение), не больше {cap}"
notes = "Уклонение — не бросок кубика на каждый удар: удары уклоняются в ровном ритме, так что за много ударов доля уклонённых равна шансу. От периодического урона по площади уклониться нельзя. Шанс против существ без звёзд по биомам:"
acc_col = "Меткость"
rating_col = "Уклонение {n}"

[formula.resistances]
title = "Сопротивления"
text = "{term} уменьшают урон своего типа: урон × (1 − сопротивление)."
formula = "сопротивление = min(предел, ваше сопротивление − пробивание врага);   предел = {cap} + максимум сопротивления, не больше {hard}"
notes = "Огонь, холод и молния учитывают ещё и стихийное сопротивление. Пробивание может опустить сопротивление ниже нуля, и тогда получаемый урон растёт."

[formula.enemy-penetration]
title = "Пробивание врагов"
text = "Существа пробивают вашу защиту по своему биому: у них есть {armour} (плоское) и {resist} (доля ваших сопротивлений). Против ударов существ ваша броня считается как {effect}."
notes = "Боссы сдвигаются к значениям следующего биома. Существа с модификатором {piercing} игнорируют больше."

[formula.strikes]
title = "Дополнительные страйки"
text = "{strike}: горизонтальный или вертикальный взмах оружия ближнего боя, основной или альтернативный; удары по земле и скипетры не считаются. Когда взмах попадает по врагу, он бьёт ещё столько раз, сколько у вас дополнительных страйков, по одному каждые {interval} с. Каждый идёт в ближайшего ещё не задетого врага в пределах {radius} м от первой цели и {reach} м от вас; когда таких нет, страйки прекращаются."
formula = "дополнительные страйки = ⌊дополнительные страйки⌋, ×2 один раз после критического удара ({double})"
hits = "Каждый дополнительный страйк — новое попадание той же атаки: он сам бросает критический удар и получает все ваши бонусы к урону. Бонусы страйков действуют и на взмах, и на каждый дополнительный страйк."
double = "С «{double}» первый критический удар атаки — взмаха или одного из её страйков — удваивает её дополнительные страйки, один раз за атаку."
focus = "С «{focus}» все дополнительные страйки бьют первую цель, по {pct} урона каждый, и прекращаются, если она умирает или уходит из досягаемости."
combo = "{combo} считает одно попадание за атаку: дополнительные страйки и фантомные удары её не увеличивают."

[formula.phantom-strikes]
title = "Фантомные удары"
text = "{phantom} могут следовать за попаданием атаки ближнего боя: самим ударом оружия или одним из его дополнительных страйков, но не снарядами, ударами по области и другими копиями. Каждый бьёт случайного врага в пределах {radius} м от задетого, включая его самого: первый через {delay} с после попадания, затем по одному каждые {interval} с."
count = "фантомных ударов за попадание = ⌊шанс⌋, +1 с вероятностью остатка"
formula = "урон фантомного удара = {share} × урон попадания без его критического удара"
damage = "Урон попадания берётся со всеми вашими бонусами к урону, но без учёта крита ({crit}), до брони и сопротивлений врага. Фантомный удар не получает ваших бонусов повторно, но бросает свой критический удар: шанс крита вашего оружия против поражённого врага (со строками для фантомных ударов) и множитель крита вашего оружия. Броня и сопротивления врага действуют на него как обычно."
stagger = "{stagger}: фантомный удар несёт {share} оглушения попадания, с накоплением оглушения, работающим с фантомными ударами, вместо накопления самого попадания."
ailments = "{gauge}: фантомные удары её не наполняют. Их огненный, ядовитый и духовный урон наносится сразу, а не со временем, а холод и молния не дают ни охлаждения, ни шока."
chain = "С {recursion} попавший фантомный удар может вызвать новые: шанс n-го поколения — шанс первого × множитель из его строки в степени n − 1. Одновременно ждут не больше {max} фантомных ударов."

[formula.rune-shield]
title = "Рунный щит"
text = "{shield} — слой поверх вашего здоровья. От попадания, прошедшего через {block}, сопротивления и броню, он забирает всё, кроме урона духом и ядом, пока не кончится; остальное идёт в здоровье. Пока он держится, получаемое {stagger} снижается на {guard}."
formula = "максимум = (база + плоский + рунный щит брони + еда + из здоровья) × (1 + увеличения)"
notes = "База по умолчанию {base} (настройка сервера): щит дают только древо, снаряжение и еда. Характеристики, переводящие здоровье в щит, дают максимальное здоровье × p ÷ (1 − p) для доли p, не больше {cap}."
ward = "Эффекты щита Valheim (например, от Посоха защиты) становятся оберегом на том, кто их получил: он поглощает урон в объёме Valheim, весь, кроме духовного и ядовитого, на время Valheim (на вас — дольше с длительностью баффов, не больше × 3). Пока держится оберег, получаемое {stagger} тоже снижается на {guard}."
recharge = "Полученный урон начинает ожидание заново. Через {delay} с без урона щит восстанавливает {rate} максимума в секунду ({full} с с нуля), быстрее с регенерацией щита. Снижение задержки восстановления сокращает ожидание не больше чем на {cap} и не ниже {floor} с."

[formula.stagger]
title = "Оглушение"
text = "{stagger} заполняется рубящим, дробящим, колющим уроном и молнией попадания, в том виде, в каком его получает цель. На пороге — максимальное здоровье × собственный множитель оглушения существа — цель оглушается. Затем шкала убывает: с полной за {drain} с у игроков и за {enemy} с у врагов (мод замедляет это)."
formula = "оглушение от вашего попадания = (урон × {share} + плоское) × (1 + {buildup} оглушения) × множитель оглушения оружия"
yours = "Ваши попадания несут {share} того, что Valheim даёт им как {power} (настройка сервера); накопление оглушения умножает это, плоское накопление добавляет."
forced = "{forced}: при срабатывании оглушение от попадания умножается на 100."
shield = "Для вашего порога {shield} считается как здоровье: прибавляется {share} его максимума, и шкала опустошается настолько же быстрее, так что от полной до нуля проходит то же время."
taken = "Получаемое вами оглушение: × (1 − {res}), не больше {cap}; снижается на {guard}, пока держится ваш {shield}. Восстановление после оглушения быстрее опустошает вашу шкалу."

[formula.block]
title = "Блок"
text = "{block}: когда вы блокируете удар спереди, Valheim считает силу блока бронёй против всего удара, всех типов урона, после собственных сопротивлений блокирующего предмета."
power = "сила блока = max(0, сила блока Valheim × (1 + собственные увеличения силы блока щита) + плоская сила блока) × (1 + увеличения силы блока)"
base = "сила блока Valheim = сила блока предмета на его качестве × (1 + навык блока × {skill})"
parry = "парирование: сила блока × бонус парирования предмета × (1 + увеличения бонуса парирования)"
parry_text = "Парирование — блок в течение {window} с после поднятия защиты предметом с бонусом парирования. Блок стоит выносливость блока Valheim × долю силы блока, которую использовал удар; парирование стоит фиксированную сумму."
blocked = "Прошедший урон считается как {armour}: сила блока меньше половины удара снимает столько же; больше — режет удар до удар² ÷ (4 × сила блока). Остаток идёт к вашей броне и рунному щиту."
guard = "Если у вас нет выносливости или {stagger} от заблокированного удара ломает защиту, ничего не блокируется. Удар, встретивший блок, не может стать {glance}."

[formula.glancing]
title = "Скользящие удары"
text = "{glance}: любой удар существа, не встретивший ваш блок, может соскользнуть. У всех есть шанс {chance} (настройка сервера), плюс шанс скользящего удара."
cap = "Не больше {cap}."
formula = "скользящий удар: получаемый урон − {cut} × (1 + увеличения снижения скользящего удара), снижение в пределах от {lo} до {hi}"
taken = "Снижение складывается с другими модификаторами получаемого урона, которые вместе снимают не больше {floor}. Оно идёт до сопротивлений, блока и брони."
block = "Удары, встретившие ваш {block}, не соскальзывают; с {guard} заблокированный удар, сломавший защиту, всё же может."

[formula.endurance]
title = "Стойкость"
text = "{endurance}: пока ваше здоровье ниже порога стойкости, часть каждого удара ниже порога снижается."
formula = "получаемый урон = удар − (часть удара ниже порога) × снижение стойкости"
notes = "Снижение — {base} базово, × (1 + увеличения), не больше {cap}. Порог считается в очках здоровья; с {rune} с ним сравнивается ваш {shield}."
order = "Применяется после ваших {res}, до {block} и {armour}."

[formula.thorns]
title = "Шипы"
text = "{thorns}: когда существо бьёт вас и вы не уклоняетесь, оно получает в ответ урон шипов. Он не зависит от удара: это ваши плоские шипы или {base}, если у вас есть только увеличенные шипы."
formula = "урон шипов = плоские шипы × (1 + увеличения урона + увеличения шипов + увеличения типа урона) × множитель блока или парирования × расстояние"
type = "Это колющий урон, если ваши характеристики не превращают часть в другие типы или не добавляют урон сверху."
range = "Полный урон атакующему в пределах {full} м от вас (от его края), падает до нуля на {zero} м."
block = "При блоке щитом с {shield}: × {block}. Шипы, работающие с парированием, добавляются к шипам парирования."
contact = "{carapace} также наносит ваши шипы касающимся вас врагам."

[formula.charged-attacks]
title = "Заряженные атаки"
text = "{charged}: что-то заряжает вашу следующую атаку оружием, и следующая выпущенная атака ближнего или дальнего боя тратит заряд, попала она или нет (заклинания — только с {spells}). Заряд ждёт один; он не копится и не истекает."
formula = "заряженная атака: + {inc} увеличенного урона, вместе с другими увеличениями урона, и действуют строки, работающие с заряженными атаками"
cooldown = "Источник заряжает снова только через {source} с после своего последнего заряда (критические удары: {crit} с). После любого заряда каждый источник ещё ждёт меньшее из своего перезаряда и {shared} с (сокращается восстановлением перезарядки). Идеальное уклонение игнорирует оба перезаряда, но не заряжает уже заряженную атаку."
alt = "С {only_alt} заряд тратят только альтернативные атаки; с {no_alt} альтернативные атаки его не тратят."
double = "{double}: бросается один раз при трате заряда. При успехе атака получает {inc} увеличенного урона вместо этого, а каждая строка, работающая с заряженными атаками, считается дважды."
splash = "{splash}: первое попадание заряженной атаки по врагу также бьёт всех других врагов в пределах {radius} м × (1 + увеличения {area}) вашей долей разброса от его урона."
sources = "Что заряжает атаку. Каждому источнику нужно пассивное умение или вариант мастерства, который его даёт:"
source_col = "Заряжает атаку, когда"
granted_col = "Даёт"
on_Crit = "вы наносите критический удар атакой"
on_Dodge = "вы начинаете перекат (идеальное уклонение заряжает даже во время перезарядки)"
on_Parry = "вы парируете удар"
on_Cast = "вы произносите заклинание"
on_Hit = "альтернативная атака попадает по врагу"
on_Jump = "вы прыгаете"
on_TrinketActivation = "вы активируете безделушку"
on_Distance = "вы пробегаете по земле или пролетаете в левитации {distance} м, пока заряд не ждёт"

[formula.area]
title = "Площадь действия"
text = "{area} растёт линейно: множитель умножает радиус удара, а не покрываемую площадь. +100% площади удваивает радиус и покрывает вчетверо больше."
formula = "радиус × max({floor}, (1 + увеличения площади) × множители площади)"
notes = "Атаки по области (в том числе {slam}) получают больший радиус; другие замахи ещё и дотягиваются дальше."

[formula.slams]
title = "Слэмы и афтершоки"
text = "{slam}: считаются атаки по области Valheim (замах кувалды и подобные), а также альтернативная атака, которую в слэм превращает {ground}: она берёт радиус области самого оружия или {radius} м, если у оружия нет атаки по области. Ваша {area} расширяет радиус слэма."
aftershock = "{aftershock}: бросается один раз за слэм, не больше 100%. Через {delay} с он вырывается в точке слэма, в радиусе слэма × увеличения площади только для афтершоков, и бьёт всё там полным уроном слэма. Афтершок не бросает новый, но шанс повтора может вызвать его ещё раз."
push = "Афтершок отталкивает врагов от точки, где вырывается."
charged = "Если {charged} не является слэмом, она тоже вызывает афтершоки, от шанса афтершока, работающего с заряженными атаками: каждые полные 100% дают один, остаток — шанс на ещё один, каждый через {delay} с после предыдущего, там, где был поражён враг."

[formula.armour-break]
title = "Разрушение брони"
text = "{brk}: дробящий урон удара разрушает броню врага так же, как наполняется {gauge}: дробящий против его базового здоровья, а повышает это {buildup}. Разрушенная доля копится до 100% и общая для всех, кто бьёт врага; через {seconds} с после последнего пополнившего её удара она исчезает."
fill = "доля, добавленная ударом = дробящий ÷ (порог недугов × базовое здоровье врага) × (1 + накопление)"
formula = "ваш физический урон + броня врага × разрушенная доля × (1 + увеличения эффекта разрушения брони), доля не больше 100%"
notes = "Каждый ваш удар по врагу с разрушенной бронёй получает эту прибавку, включая удар, который только что её пополнил, распределённую по дробящему, рубящему и колющему (дробящим, если их нет). Она добавляется раньше, чем действует {armour} врага, так что возвращает примерно столько, сколько снимает броня."

[formula.impale]
title = "Прокол"
text = "{impale}: колющий урон удара может наложить прокол. Шанс работает как {gauge}: колющий урон против базового здоровья врага, его повышает {buildup}."
chance = "шанс = (колющий ÷ (порог недугов × базовое здоровье врага) + плоское накопление) × (1 + увеличения накопления), не больше 100%"
formula = "физический урон ваших ударов × (1 + проколы × {stack} × (1 + увеличения урона недугов))"
notes = "Враг держит до {limit} проколов (больше с пределом проколов). Каждый новый прокол обновляет все на {window} с × (1 + увеличения длительности недугов), не меньше {floor} с."

[formula.limit]
title = "Пределы"
text = "{limit}: бонус, который называет эффект, повышает только этот эффект. Бонус, который не называет ничего, повышает сразу все пределы ниже. Бонусы сначала складываются, и итог округляется вниз."
effect = "Предел"
base = "База"
per_cast = "Рабов за призыв посоха призыва"
spores = "{spore}: сколько одновременно"
crystals = "{crystal}: сколько одновременно"
shards = "Осколков брони одновременно"
impales = "{impale}: сколько выдерживает один враг"
links = "{link}: сколько одновременно"
chain = "Исключение — цели Цепной молнии ({n}): они учитывают только бонусы к пределу, которые называют Цепную молнию."

[formula.lifesteal]
title = "Вампиризм"
text = "{leech}: доля здоровья, которую ваши удары оружием и снарядами реально снимают с врага; заклинания используют вампиризм заклинаний. Кровотечение, шипы и эхо-удары его не дают."
formula = "похищено = снятое здоровье × вампиризм"
rate = "Каждый удар запускает свой вампиризм, которое возвращает {rate} максимального здоровья в секунду, пока не выплатится. Все вместе дают не больше {cap} в секунду; этого достигают {n} одновременных. Полное здоровье обрывает все идущие."

[formula.hit-damage]
title = "Урон удара"
text = "Урон удара складывается из частей ниже; в разделе «{order}» они идут в том порядке, в каком происходят."
see_order = "Все шаги удара по порядку: [{title}]({link})."
flat_title = "Плоский урон"
flat = "{flat} добавляется до всех увеличений, × ваш {factor} (тот же, что и у собственного урона оружия). Куда он идёт:"
flat_main = "общий плоский урон и плоский урон для вида удара (вида вашего оружия, ближнего боя, заклинаний, снарядов, атак, альтернативных атак и т. п.): в самый большой тип урона удара"
flat_physical = "плоский физический урон: в самый большой из режущего, колющего и дробящего (в дробящий, если их нет)"
flat_typed = "плоский режущий, колющий или дробящий урон: только если у удара уже есть этот тип"
flat_element = "плоский урон огнём, холодом, молнией, ядом или духом: всегда, этим типом"
flat_elemental = "плоский стихийный урон: в самый большой из огня, холода и молнии удара, только если один из них есть"
oil = "Свой тип урона добавляют и {oil} оружия — до плоского урона, без множителя навыка."
harmless = "Попадание совсем без урона не получает ни масел, ни плоского урона."
conversion_title = "Конвертация"
conversion = "{conversion} превращает часть режущего, колющего и дробящего урона удара в другой тип — после плоского урона и до увеличений; другие типы не конвертируются. Каждый из трёх конвертируется своими конвертациями плюс конвертациями всего физического урона; если вместе больше 100%, они вместе уменьшаются до 100%."
conversion_target = "Конвертация, зависящая от врага (против боссов, врагов с недугами и т. п.), тоже учитывается."
conversion_formula = "сконвертировано = режущий, колющий или дробящий × его конвертация в новый тип, все его конвертации вместе не больше 100%"
converted = "Сконвертированный урон считается новым типом для сопротивлений и недугов, но растёт от увеличений обоих типов: старого и нового, сложенных вместе."
gain = "{gain}: считается от режущего, колющего и дробящего урона до конвертации и добавляется после него новым типом. Растёт только от увеличений своего нового типа."
increases_title = "Увеличения"
increases = "Весь увеличенный и уменьшенный урон, действующий на удар, складывается в одну сумму, и удар один раз умножается на 1 + эту сумму: общий урон, урон вида вашего оружия, ближнего боя, дальнего боя или заклинаний, атак, альтернативных атак, ударов не снарядами, бонус атаки с разбега и увеличения, зависящие от врага (ниже)."
scepters = "Попадания скипетра считаются тем видом атаки, которым они являются: его заклинания получают увеличения урона заклинаний, остальные атаки — ближнего или дальнего боя."
increases_formula = "урон типа = (урон оружия × множитель навыка + масла + плоский урон × множитель навыка) × (1 + увеличения + увеличения этого типа)"
typed = "Каждый тип урона добавляет к сумме свои увеличения, только для себя: огонь, холод и молния — ещё и увеличения стихийного урона, режущий, колющий и дробящий — увеличения физического урона. Поэтому +50% урона и +50% урона огнём дают урону огнём × 2, а не × 2,25."
more_title = "Множители «больше»"
more = "Урон «больше» (и «меньше») умножает удар отдельно, множитель за множителем: больше урона и больше урона для вида вашего оружия, затем {rage}: × (1 + {per} за очко × (1 + увеличения эффекта ярости)), не для заклинаний."
projectile = "{proj}: их увеличения урона не входят в сумму. Урон снаряда умножается отдельно на (1 + увеличения урона снарядов) × больше урона снарядов. Увеличения урона факела ({torch}) умножают так же."
target_title = "По врагу"
target = "Когда удар доходит до врага, увеличения, зависящие от него, входят в ту же сумму:"
target_kind = "увеличения против врагов определённого рода или состояния (боссов, врагов с недугами и т. п.)"
target_backstab = "{backstab}: против врага, который вас не заметил; собственный бонус удара в спину Valheim отключён"
target_stagger = "+{x}, пока враг оглушён, вместо двойного урона Valheim ({stagger})"
target_charged = "{charged}: +{x}"
target_flat = "Плоский урон по врагу (плоский урон удара в спину, плоский урон против врагов определённого рода) идёт в самый большой тип удара, × ваш множитель навыка × (1 + вся сумма). Он идёт после крита ({crit}), так что крит его не умножает."
target_both = "Последними идут увеличения и множители «больше», которым нужно что-то от удара и что-то от врага вместе; увеличения входят в ту же сумму."

[formula.hit-order]
title = "Порядок удара"
