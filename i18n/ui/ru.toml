item_intro = "Что делает с этим предметом каждое Клеймо владыки, способное его возвысить, на качестве 1 (в скобках — прибавка за каждое качество; возвышение сбрасывает качество до 1, а улучшенный предмет сохраняет не меньше, чем имел). Как это работает: [{title}]({link})."
brand_link = "Возвышает предмет экипировки до биома «{biome}» (уровень предмета {level}): см. [{title}]({link})."
title = "Возвышение"
text = "Клеймо владыки, которое выпадает из боссов, возвышает предмет экипировки до более позднего биома — один раз на предмет и только вверх: собственный биом предмета (биом самого высокоуровневого материала в рецепте; у посоха — биом его раба; у уникального предмета — биом его уровня предмета или собственного уровня уникального, что выше) должен быть раньше биома клейма."
essence = "Клеймо"
how = "Оружие, щиты, броня и посохи призыва сравниваются с предметами самой Valheim того же вида из этого биома (вид оружия и одно- или двуручное, вид щита или слот брони) и поднимаются до их медианы; ниже они не становятся:"
weapons = "оружие: боевой урон (всё, кроме рубки и добычи) растёт до наибольшей медианы оружия этого вида среди биомов от собственного биома предмета до биома клейма, с теми же типами урона; кроме того, он растёт не меньше, чем урон оружия Valheim от биома предмета до биома клейма, и никогда не меньше одного среднего шага между биомами (рост урона от первого биома до последнего, поровну разделённый на шаги между ними); так же и урон за уровень качества. Виды без собственного оружия Valheim, стихийные посохи и скипетры растут на наибольший рост урона оружия от биома предмета до любого биома вплоть до биома клейма, × множитель урона возвышения из базовых бросков предметов сервера, если он есть."
one_handed = "{items}: сравнивается вместо этого со всем одноручным оружием Valheim, так же; его урон за уровень качества становится таким, как в биоме клейма."
shields = "щиты: {block} и {force} и их прирост за уровень качества становятся не ниже, чем у медианного щита этого вида в биоме."
staves = "посохи призыва: сам посох не меняется, но его рабы призываются как существа нового биома ({strength})."
armour = "доспехи (шлемы, нагрудники, поножи и плащи с бронёй): их {armour} и её прирост за уровень качества становятся не ниже, чем у медианного доспеха этого слота в биоме."
level_only = "Остальная экипировка со свойствами (кольца, пояса, амулеты, безделушки, вспомогательные предметы, плащи без брони, инструменты, факелы, бомбы, ловушки и оружие с боевым уроном меньше {min}) получает только уровень предмета: её качество, характеристики и свойства сохраняются."
durability = "{durability} и её прирост за уровень качества становятся не ниже, чем у предметов биома."
keeps = "Улучшенный предмет сохраняет не меньше урона, силы блока, силы парирования, брони и прочности, чем у него было на его качестве."
after = "Оружие, щит, броня или посох возвращается к качеству 1, а улучшать его стоит столько же, сколько эталонный предмет биома, на станции этого предмета. Уровень любого возвышенного предмета поднимается до уровня биома. Свойства, гнёзда и сигилы остаются. Порченые и неопознанные предметы и самоцветы возвысить нельзя."
vanilla = "Посохи призыва самой Valheim возвышаются как посохи призыва, только пока выключена серверная настройка Vanilla summoning staves; пока она включена, они возвышаются как обычное оружие, а их призванные не меняются."

