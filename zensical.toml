# Base site config. `povwiki build` copies this per language into build/<lang>/zensical.toml
# and overrides: docs_dir, site_dir, site_url, theme.language and nav.
# Edit theme/markdown settings here; do not set nav here (it is generated).

[project]
site_name = "Path of Valheiman DB"
site_description = "Datamined wiki for the Path of Valheiman Valheim mod"
# Root URL of the site, without the language suffix. A custom domain here is also written to
# the gh-pages CNAME file on deploy (deploy.py).
site_url = "https://povdb.wiki/"
repo_url = "https://github.com/Amri-Tarik/pov-wiki"
extra_css = ["stylesheets/pov.css", "stylesheets/theme.css"]
extra_javascript = ["javascripts/tree.js", "javascripts/search-boost.js", "javascripts/mobile-nav.js", "javascripts/ascension.js"]

[project.theme]
language = "en"
features = [
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
