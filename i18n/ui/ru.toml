[formula.creature-level]
title = "Уровни областей"
text = "У каждого биома фиксированный уровень. Уровень существа — уровень биома, в котором оно стоит (звёзды его не меняют): он задаёт его меткость и уровень предметов в его добыче, сундук берёт уровень своего биома, а снаряжение, купленное у торговца, — уровень биома, где стоит торговец. Здоровье и урон он не масштабирует, кроме боссов монолитов. С настройкой «Raid level scaling» (по умолчанию выключена, включена на «Беспощадно») рейдеры получают уровень биома, из которого пришёл рейд, и масштабируются вместе с ним. У каждого биома есть и рекомендуемый уровень игрока: до уровня следующего биома он даёт полный опыт; дальше опыт [угасает]({falloff})."
arena = "Внутри арены со своим уровнем (купол босса рунного монолита, карта «{halls}») существа сражаются на этом уровне, и их добыча берёт его."
blight = "Существо в Тумане скверны берёт уровень биома следующего босса по прогрессу мира (первого ещё не побеждённого; Дальний север после Фейдера), где бы оно ни стояло."
full_col = "Полный опыт до уровня"

[formula.creature-strength]
title = "Здоровье и урон"
text = "Здоровье и урон существа — значения Valheim, умноженные на эти множители:"
health = "Здоровье = базовое здоровье × биом × множитель звезды ^ звёзды × приручение × Сила монстров × Туман скверны × Пожиратель душ"
damage = "Урон = базовый урон × биом × множитель звезды ^ звёзды × приручение × Сила монстров × Туман скверны × Пожиратель душ"
terms = "Биом: множитель биома существа (таблица ниже; боссы берут столбцы боссов). Звёзды: см. [Звёзды]({stars}). Приручение: у прирученного существа {tamed} от этого. Сила монстров: см. [Сила монстров]({power}). Туман скверны: только внутри тумана. Пожиратель душ: только у существа с модификатором [«{soul}»]({mods}), которое растёт с каждым поглощённым существом. Сверху действуют собственные настройки сложности мира Valheim."
growth = "Начиная с биома «{biome}», у существ каждого биома примерно ×{h} здоровья и ×{d} урона от предыдущего."
boss_health = "У некоторых боссов сверху есть ещё один множитель здоровья: {bosses}."
species = "У некоторых видов свой множитель здоровья, который заменяет множитель биома: {species}."
soften = "множитель = 1 + (множитель биома − 1) × масштаб"
fixed = "Своё здоровье сохраняют: {creatures}."
summons = "{minions}: ваши призванные масштабируются по-своему, см. [силу призванных]({link})."
[formula.boss-step]
title = "После босса биома"
text = "Когда босс биома побеждён, существа этого биома проходят часть пути к множителям следующего биома (здоровье, урон и пробивание): {near} у центра мира и до {far} вдали от него. Боссы не усиливаются, Дальний север тоже."
formula = "шаг = {near} + ({far} − {near}) × t,   t = (расстояние от центра мира − ближе) ÷ (дальше − ближе), от 0 до 1"
species = "Волки и драугры сохраняют свой множитель здоровья, поэтому растёт только их урон."

[formula.stars]
title = "Звёзды"
text = "Звёзды делают существо сильнее, задают его [редкость]({rarity}) и приносят модификаторы."
health = "Здоровье × {h} ^ звёзды"
damage = "Урон × {d} ^ звёзды"
stacking = "Звёзды перемножаются: при ×{h} за звезду две звезды дают ×{h2}, пять — ×{h5}, восемь — ×{h8}."
chance = "Каждый шаг звезды выпадает с шансом {chance} (в Valheim 10%) и бросается, пока не сорвётся, до двух звёзд; враждебные существа в родном биоме всегда могут получить {home}. Существо с двумя звёздами затем получает ещё звезду с шансом {above} каждый раз, до наибольшего числа звёзд пресета. Каждая звезда приносит модификаторов: {mods}. Шансы первого броска:"

[formula.boss-stars]
title = "Звёзды боссов"
text = "Босс, призванный на своём алтаре или возвращённый вместе со своим местом руной «{rune}», может появиться со звёздами: шанс {chance} хотя бы на одну звезду и {two} на две и больше (входит в {chance}). После второй каждая следующая звезда выпадает с шансом {above}, до наибольшего числа звёзд пресета ({cap} на «Нормально») — того же предела, что и у [других существ]({stars}). По умолчанию — только после того, как этот босс уже побеждён в мире. Руны «Rune of the Blood Challenge» (до {max}), положенные на алтарь босса — Valheim или одного из [боссов]({bosses}) мода, — дают следующему призванному там боссу по звезде за каждую вместо броска, до наибольшего числа звёзд пресета, даже до первой победы над ним или с выключенными звёздами боссов, и не меньше одного модификатора за звезду."
health = "Здоровье × {h} ^ звёзды"
damage = "Урон × {d} ^ звёзды"
notes = "Модификаторов за звезду босса: {mods} на «Нормально», 1 на «Сложно» и «Беспощадно»."

[formula.monster-power]
title = "Сила монстров"
text = "Подношение трофеев боссов на Алтаре силы делает существ этого биома сильнее, и их становится больше:"
formula = "Сила монстров = 1 + {step} × подношения, не больше ×{max}"
notes = "Она умножает здоровье и урон диких существ биома, включая боссов (но не прирученных), но не прибавляет к их добыче. Каждое подношение также поднимает враждебное население биома на {pop}: настолько больше его диких существ (не боссов) может быть рядом одновременно, и настолько быстрее они появляются. Максимум Силы монстров достигается после {n} подношений; каждое подношение стоит на один трофей больше предыдущего."

[formula.loot]
title = "Добыча"
text = "Когда существо умирает, его добыча Path of Valheiman бросается с двумя числами — {quantity} и {rarity}:"
quantity = "Количество = 1 + количество предметов + {star} × звёзды + {mod} × модификаторы"
rarity = "Редкость = редкость предметов + {star} × звёзды"
star_scale = "Существа и элитные (не боссы и не сундуки) дают меньше на пресете, где звёзд или существ больше, чем в эталоне — звёздах «Нормального» при плотности существ {density}: при бо́льшем числе звёзд слагаемые звёзд и модификаторов в количестве и редкости × доля звёзд пресета, а их количество × его множитель количества, чтобы добыча на площадь оставалась близкой к эталону:"
star_share = "Доля звёзд"
quantity_share = "Множитель количества"
womb = "Существо, элитное или босс, убитые в Тумане скверны, также с шансом {chance} роняют [{womb}]({link})."
notes = "Количество и редкость предметов — собственные у убийцы, из пассивных узлов и снаряжения. Модификаторы добавляют количество, но не редкость. Считается не больше {cap} звёзд и столько модификаторов, сколько приносят {cap} звёзд. Убийство вашим призванным, спутником или питомцем считается вашим. Уровень предметов добычи — уровень существа (внутри арены со своим уровнем, например на карте «{halls}», — уровень арены); уникальные предметы и самоцветы тоже его хранят (видно с Alt). Собственная таблица босса (сущности, уникальные самоцветы...) бросается с указанными в ней шансами, каким бы ни был уровень босса."
sources = "Добыча за убийство"
sources_note = "Каждый вид бросает своё число предметов: в среднем столько × количество."
lambda = "В среднем"
jewel = "Самоцветы"
by_level = "Редкость по уровню предмета"
by_level_note = "Снаряжение никогда не выпадает обычным: оно волшебное или редкое, по этим весам, которые редкость сдвигает к редкому. Базовые самоцветы могут выпасть и обычными, с весом {white} от веса волшебного (после редкости):"
curve = "c = редкость ÷ (1 + редкость);   волшебный × (1 + c),   редкий × (1 + 2c)"
common = "Обычный"
magic = "Волшебный"
rare = "Редкий"
unique = "Каждый выпавший предмет снаряжения с шансом {chance} × (1 + c) оказывается уникальным. С боссов всегда выпадает хотя бы волшебный предмет, с уровня {level} — редкий."
gear = "Снаряжение"
currency = "Валюта"
gates = "По умолчанию снаряжение выпадает, только когда вам известен его рецепт (все материалы); у валюты, самоцветов и уникальных предметов такого ограничения нет. Сервер может отключить каждый вид по источнику (враги, боссы, сундуки) и изменить их частоту."
rooms = "Комнаты «{halls}» выпадают чаще своей доли валюты: каждое убийство и сундук ещё бросают {boost} × долю комнат в своих выпадениях валюты ([где выпадают комнаты]({link}))."

[formula.vanilla-drops]
title = "Добыча Valheim"
text = "Собственная добыча существа (мясо, шкуры...) выпадает с тем же шансом при любом числе звёзд. Вместо этого звёзды увеличивают её количество, кроме трофеев и предметов, которые не складываются в стопку:"
formula = "количество × (1 + {s} × звёзды), звёзды считаются до {stars}, не больше {cap}"
rounding = "Оставшаяся дробная часть — шанс получить ещё одну единицу."
star_share = "Кроме боссов, этот бонус звёзд умножается на [долю звёзд]({loot}) пресета сложности."
monolith = "Дополнительный предмет биома от стража рунного монолита растёт по тому же правилу."
foreign = "Когда уровни существ задаёт другой мод, действует правило самой Valheim: каждая звезда удваивает шанс каждой добычи, которую игра отмечает как растущую с уровнем, и, если игра не указывает иначе для этой добычи, её количество."
foreign_formula = "шанс × 2 ^ звёзды;   количество × 2 ^ звёзды, не больше {cap}"

[formula.experience]
title = "Опыт"
text = "Опыт за убийство:"
formula = "Опыт = базовое здоровье × {h} × (1 + {s} × звёзды + {m} × модификаторы)"
notes = "Базовое здоровье — здоровье вида в Valheim. Опыт делится между живыми игроками в пределах {radius} м (для боссов — в {boss} раза дальше). Ночью любой опыт +{night}. Существа рунного события дают {event}."
sources = "Уровень персонажа растёт только от боя: убийства и удары боевых навыков. Всё мирное (сбор, строительство, ремесло, исследование, путешествия) идёт в {craft} и никогда не урезается [угасанием опыта]({falloff})."

[formula.attributes]
title = "Атрибуты"
text = "Каждое очко атрибута даёт:"
attribute = "Атрибут"
per_point = "За очко"
per_hundred = "За 100 очков"
increased = "{x} увеличение: {term}"
increased_regen = "{x} увеличение регенерации: {term}"
plus = "+{x}: {term}"
skill = "Оружие, которым управляют атрибуты, умножает свой урон на случайный {factor}, заново выбираемый для каждого попадания между его серединой − {spread} и + {spread}, не ниже 0. Середина растёт с очками управляющих атрибутов оружия (если их два — их среднее); уровень навыка оружия самого Valheim не учитывается."
formula = "середина = {center} × (1 + {coef} × (очки ÷ {full})^0.75)"
points = "Очки"
midpoint = "Середина"
governing = "Управляющие атрибуты по навыкам оружия:"
weapon = "Навык оружия"
governs = "Управляющие атрибуты"
scepters = "Скипетрами управляют {str} и {int}, каким бы ни был их навык."
shifted = "С «{mastery}» {pct} вашей характеристики «{str}» также считается как «{dex}» для двуручного оружия и луков (кроме кастетов)."

[formula.crit-multiplier]
title = "Урон критического удара"
text = "{term} умножает урон удара на:"
formula = "{base} + бонусы критического урона, не меньше 0"
magazine = "На последнем заряженном выстреле арбалета ([магазин]({magazine})), если у вас есть увеличения критического урона для этого выстрела, множитель равен 1 + ({half} + плоские бонусы критического урона) × (1 + все увеличения критического урона, действующие на выстрел) × больше критического урона: увеличения тогда умножают и основу."
notes = "Бонусы состоят из частей, каждая — плоские бонусы × (1 + увеличения): общие, для вида вашего оружия, для цели и для альтернативной атаки. Части считаются отдельно и складываются, поэтому общее «уменьшение критического урона» не снижает собственный бонус оружия."

[formula.crit-chance]
title = "Шанс критического удара"
text = "Шанс критического удара начинается с базы оружия:"
formula = "шанс = (база + плоский) × (1 + увеличения) × больше, не выше максимума"
bases = "База: ножи {knives}, древковое {polearms}, остальное оружие {other}, заклинания {spells}. Собственные свойства шанса крита на оружии применяются к его базе первыми. Максимум по умолчанию {ceiling}."

[formula.evasion]
title = "Уклонение"
text = "{evade} даёт шанс избежать удара. Он зависит от меткости атакующего ({accuracy}), которая растёт с его уровнем и звёздами:"
accuracy = "меткость = ({base} + {per} × уровень) × (1 + {star} × звёзды)"
chance = "шанс уклонения = уклонение ÷ ({ratio} × меткость), не больше {cap}"
regen = "Каждое уклонение заново запускает задержку восстановления выносливости, даже бесплатное; с {unbroken} уклонения не прерывают восстановление выносливости."
notes = "Каждый удар бросается отдельно. Каждое уклонение снижает шанс против всех атакующих: × {decay} за уклонение, пока не пройдёт {reset} с без удара, от которого можно уклониться. Шанс выше 100% даёт верное уклонение, пока уклонения не опустят его ниже. Удары без атакующего (например, заклинание, чей заклинатель исчез) бросаются против меткости существа 1-го уровня. От периодического урона уклониться нельзя. Шанс против существ без звёзд, до уклонений, по биомам:"
avoided = "Удар, от которого вы уклонились, ничего не накладывает: ни урона, ни недугов, ни эффектов, ни ошеломления, ни отбрасывания; как и удар, от которого вы увернулись перекатом."
cost = "Уклонение стоит выносливости по тому, сколько урона удар нанёс бы здоровью после всей вашей защиты (броня, сопротивления, скользящие удары, рунный щит, стойкость): {min} максимальной выносливости, если это {low} максимального здоровья или меньше, равномерно растя до {max} при {full}× максимального здоровья и больше. Снижение затрат выносливости на уклонение уменьшает её, не больше чем на {cap}, а шанс уклониться без выносливости делает уклонение бесплатным; если выносливости меньше, уклониться нельзя."
acc_col = "Меткость"
rating_col = "Уклонение {n}"

[formula.resistances]
title = "Сопротивления"
text = "{term} уменьшают урон своего типа: урон × (1 − сопротивление)."
formula = "сопротивление = min(предел, ваше сопротивление − пробивание врага);   предел = {cap} + максимум сопротивления, не больше {hard}"
notes = "Огонь, холод и молния учитывают ещё и стихийное сопротивление, а рубящий, колющий и дробящий — физическое. Эффекты на все сопротивления действуют на каждый тип, и на физические тоже. Пробивание может опустить сопротивление ниже нуля, и тогда получаемый урон растёт."
vanilla = "Собственные сопротивления Valheim — на снаряжении, плаще и щите, в медовухах и от эффектов — это очки сопротивления, которые прибавляются к вашим, под тем же пределом. Каждый источник добавляет свои очки:"
grade = "Степень Valheim"
points = "Сопротивление"
grade_slight = "Слабое сопротивление"
grade_resistant = "Сопротивление"
grade_very = "Сильное сопротивление"
grade_immune = "Иммунитет (не полная неуязвимость)"
vanilla_notes = "Сопротивления щита действуют, пока вы им блокируете. Сопротивления Valheim к типу действуют, только пока итог самой Valheim для этого типа — сопротивление. Уязвимости Valheim — множители получаемого урона:"
weakness = "Уязвимость Valheim"
taken = "Получаемый урон"
weak_slight = "Слабая уязвимость"
weak_weak = "Уязвимость"
weak_very = "Сильная уязвимость"

[formula.enemy-penetration]
title = "Пробивание врагов"
text = "Существа пробивают вашу защиту по своему биому: у них есть {armour} (плоское) и {resist} (доля ваших сопротивлений). Против ударов существ ваша броня считается как {effect}, больше с увеличениями эффективности брони."
