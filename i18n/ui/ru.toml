[formula.summon-strength]
title = "Сила призванных"
text = "Призванные не получают обычного масштабирования существ: ни [звёзд]({stars}), ни доли приручения, ни [Силы монстров]({power}), ни Тумана скверны."
formula = "здоровье или урон призванного = база × множитель здоровья биома × сила призыва"
terms = "Биом — биом посоха (в таблицах здесь), его множитель — из [таблицы биомов]({stages}), смягчённый пресетом сложности; и здоровье, и урон берут столбец здоровья. Глобальные настройки атаки и защиты врагов тоже действуют. Здоровье также × (1 + ваши увеличения здоровья приспешников) и +{quality} за каждый уровень качества посоха выше 1. Сила призыва есть только у посохов Valheim (ниже)."

[formula.vanilla-summons]
title = "Посохи призыва Valheim"
