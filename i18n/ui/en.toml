board_intro = "The skill board holds the [skill gems]({index}) in the equipment window, tab Skills. Gems work through the cells they share a side with."
cells = "Cells"
cells_text = "The board has {cells} hexagonal cells in two rings around the centre; {open} are open from the start (filled above). Each {chisel} opens one more locked cell."
roles = "How gems connect"
adjacency_rules = "An effect takes one trigger beside it that can start it: the one chosen in the board window, or else the first in board order. A curse can take a {malice} beside it instead. A trigger works only when it starts at least one effect; when it fires, it starts all of them. A support changes every effect or aura beside it whose tags it supports (listed on its page); the {gifts} takes every support beside it. Auras need no trigger: they work while switched on."
feeds = "Which trigger starts which effect"
feeds_intro = "A trigger gives its effects what its event has: a living target, a shot, an incoming hit, a corpse. An effect that needs more than that stays unconnected."
effect = "Effect"
feeds_note = "✓: the trigger starts the effect; —: it cannot (hover for the game's reason). {on_block} also fires on parries."
states = "States"
states_intro = "A gem's tooltip on the board says what it is doing:"
capacity_title = "Capacity"
capacity_formula = "capacity = {base} + min({most}, ⌊passive points earned ÷ {per}⌋)"
capacity_text = "Every gem on the board takes capacity, connected or not. A new character has {base}; every {per} passive points earned add one, up to {full} at {points} points. Opening a cell adds none."
role = "Gem"
over_capacity = "{over} Placing a gem that would take more capacity than the board has is refused."
stamina_title = "Stamina cost"
stamina_text = "Hit, critical hit and kill triggers raise the stamina cost of every attack, hit or miss; block and parry triggers raise the stamina cost of every block, once per block. It is paid whether the trigger fires or not."
stamina_formula = "cost added by a trigger = Σ over its working effects (its price per effect + {support}% × supports of that effect) × the effect's cost multiplier"
stamina_terms = "The cost multiplier comes from the effect's supports: {long_seal} makes it cost more, {thrifty} less; {long_seal}'s longer duration also adds half of itself on effects with the Duration tag. The attack's or block's stamina is multiplied by 1 + the sum of its triggers' costs."
stamina_example = "Example: {trigger} beside {effect} with two supports adds {cost}% + 2 × {support}% = {total}% to every attack's stamina."
eitr_title = "Eitr reserve"
eitr_formula = "reserve = (the aura's reserve + {support} × supports beside it) × its supports' cost multiplier × (1 − reservation efficiency)"
eitr_terms = "Maximum {eitr} is lowered by the reserve of every switched-on aura. Auras reserve in board order: one that no longer fits waits ({waiting}) and the next one is still tried. A switched-off aura, or a board over capacity, reserves nothing. Switching on or placing a gem that would leave an aura waiting is refused. Reservation efficiency counts up to {cap}%."
eitr_formula_share = "reserve = (the aura's share × maximum eitr + {support} × supports beside it) × its supports' cost multiplier × (1 − reservation efficiency)"
eitr_share_terms = "The share is of the whole maximum {eitr}. Auras reserve in board order out of what is left once your summons and bells hold theirs ([held eitr]({held})): one that does not fit waits ({waiting}) and the next one is still tried; with 1 maximum eitr or less, none fits. A switched-off aura, or a board over capacity, reserves nothing. Switching on or placing a gem that would leave an aura waiting is refused. Reservation efficiency counts up to {cap}%."
eitr_example = "Example: {aura} ({share}) with one support, at {eitr} maximum eitr, reserves {share} × {eitr} + {support} = {total} eitr."
eitr_circles = "The {gifts} adds its own amount per support instead; the {malice} also adds {curse} per curse it keeps, and {more} more for each {heavy} on a kept curse."
per_link = "Each one beside it"
per_support = "+{n} per support"
per_curse = "+{n} per curse kept"
curses_title = "Curses"
curse_limit = "One player keeps {base} curse on each enemy; {nodes} raises that (at most {limit_max}). Other players' curses do not count against yours."
curse_store = "A curse you already keep on the enemy refreshes: it lasts until the later end and keeps the stronger value. A new one past your limit replaces your oldest; a curse kept by the {malice} is refused instead."
curse_value_formula = "curse value = its value at its rank × (1 + increased curse effect + {heavy}), at most {max}%"
curse_value_terms = "Passives that increase curse effect include {nodes}."
curse_duration_formula = "duration = 6 s × (1 + increased curse and effect duration) × more effect duration × {long_seal} × {heavy}, at most {seconds} s"
curse_duration_terms = "Passives that increase curse duration include {nodes}."
ranks_title = "Ranks and cutting"
ranks_text = "A gem has a rank from 1 to {top}. Each rank above 1 adds {step}% of its rank-1 value to the numbers that grow (damage shares, heals, curse values, support bonuses, an aura's whole effect). Chances, cooldowns, areas, counts, durations, costs, capacity and eitr reserve stay as they are."
rank_formula = "value at rank r = value at rank 1 × (1 + {step}% × (r − 1))"
ranks_rules = "A gem has a rank from 1 to {top}. Every rank above 1 changes something:"
rank_grow = "What the gem does (damage shares, heals, curse values, support bonuses, an aura's whole effect) grows by {step}% of its rank-1 value."
rank_drawback = "A drawback (a support's less damage, longer rest or higher cost; what an aura does to its own bearer) softens by {soft}% of its rank-1 value."
rank_count = "A support that adds projectiles, chains or pierces ({gems}) gives an {overflow}: +100% for each one it adds at rank 1, and +{count}% per rank above."
rank_chance = "A trigger's chance below 100% grows by {step}% of its rank-1 value, up to 100%."
rank_sure = "A trigger that always fires ({gems}) rests {cd}% of its rank-1 cooldown less instead."
rank_fixed = "Areas, ranges, counts, limits, durations, the cooldowns of effects, costs, capacity and eitr reserve stay as they are, except where a gem makes one its benefit ({gems})."
rank_drawback_formula = "drawback at rank r = drawback at rank 1 × (1 − {soft}% × (r − 1))"
rank_count_formula = "overflowing chance at rank r = 100% × added at rank 1 + {count}% × (r − 1)"
rank_sure_formula = "cooldown at rank r = cooldown at rank 1 × (1 − {cd}% × (r − 1)), for a trigger that always fires"
auras_title = "Auras at work"
aura_strength_formula = "aura strength = (1 + increased aura effect) × more aura effect × (1 + its supports' effect) × (1 + {step}% × (rank − 1))"
aura_strength_terms = "The strength multiplies the aura's own numbers (rune shield, regeneration, endurance, poison damage) and what the Circle of Gifts grants. {inner} adds to its supports' effect; {wide} takes from the effect of an aura that deals no damage."
aura_inner = "An aura supported by {inner} affects only its bearer: allies around it gain nothing."
aura_gifts = "The {gifts} grants each support beside it as an aura form ([aura forms]({forms})): its increases × the circle's strength × (1 + {step}% × (support rank − 1)); its overflowing chances follow the support's rank alone, and its drawbacks soften with that rank."
aura_periodic = "{plague} and {heat} deal damage over time instead of hits. Every {pulse} s, {plague} deals {pulse} s of its poison damage per second to each enemy in range. Fire damage taken lights {heat}: for its duration, every {tick} s it deals {tick} s of its share of the fire taken in the last second. These ticks cannot be blocked or dodged, and neither stagger nor push; the character's increased and more damage count, with its damage for area, damage over time and auras (and spells, for a Spell gem)."
stats_title = "Gems and your stats"
stats_text = "A gem effect counts the character's own stats for what it is: increased damage and the damage of its kind (area, projectile, spell for a Spell gem), area of effect, effect duration, extra projectiles, pierce and chains, shot speed and knockback. Its supports' numbers (an overflowing chance, increased area, longer duration) add into the same sums as the character's own, and its hits then go through the character's hit rules like any other hit."
rank_level_text = "An uncut gem's rank comes from the level of the creature or chest that drops it: 1 + ⌊level ÷ {step}⌋, at most 5."
cutting_text = "Right-click an uncut gem to open its cutting window: {trigger} cuts into any trigger, {effect} into any effect, curse or aura, {support} into any support. The gem gets the uncut gem's rank. The same uncut gem can instead raise one gem of its kind, in the bag or on the board, by one rank, up to its own rank."
