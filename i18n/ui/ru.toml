chain = "Шанс цепи, который называет Цепную молнию, тоже добавляет цели: каждые полные 100% — ещё одна, а остаток — шанс ещё одной при каждом срабатывании."

[formula.lifesteal]
title = "Вампиризм"
text = "{leech}: доля здоровья, которую ваши удары оружием и снарядами реально снимают с врага, по доле дробящего, режущего и колющего урона в ударе; их огонь, мороз, молния, яд и дух здоровья не возвращают. Заклинания используют вампиризм заклинаний, который пьёт от всего их урона. Кровотечение, шипы и эхо-удары его не дают."
formula = "похищено = снятое здоровье × (дробящий + режущий + колющий) ÷ весь урон удара × вампиризм; заклинания: снятое здоровье × вампиризм заклинаний"
typed = "Похищение здоровья с типом урона (с уроном духа и т. п.) так же пьёт от доли этого типа в атаке. Если такое похищение восстанавливает рунический щит, оно наполняет щит с той же скоростью, долей от его максимума."
rate = "Каждый удар запускает свой вампиризм, которое возвращает {rate} максимального здоровья в секунду × (1 + увеличения скорости вампиризма), пока не выплатится. Все вместе дают не больше {cap} в секунду; при базовой скорости этого достигают {n} одновременных. Полное здоровье обрывает все идущие."

[formula.hit-damage]
