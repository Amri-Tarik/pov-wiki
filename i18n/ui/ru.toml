eitr_terms = "Максимальный {eitr} уменьшается на резерв каждой включённой ауры. Ауры резервируют по порядку доски: та, что уже не помещается, ждёт (состояние «{waiting}»), а следующую всё равно пробуют. Выключенная аура или доска сверх ёмкости ничего не резервирует. Включить ауру или поставить камень, из-за которого аура будет ждать, нельзя. Эффективность резервирования учитывается до {cap}%."
eitr_formula_share = "резерв = (доля ауры × максимальный эйтр + {support} × соседние поддержки) × множитель цены её поддержек × (1 − эффективность резервирования)"
eitr_share_terms = "Доля берётся от всего максимального {eitr}. Ауры резервируют по порядку доски из того, что остаётся после эйтра, удерживаемого вашими призванными существами и колоколами ([удерживаемый эйтр]({held})): та, что не помещается, ждёт (состояние «{waiting}»), а следующую всё равно пробуют; при максимальном эйтре 1 и меньше не помещается ни одна. Выключенная аура или доска сверх ёмкости ничего не резервирует. Включить ауру или поставить камень, из-за которого аура будет ждать, нельзя. Эффективность резервирования учитывается до {cap}%."
eitr_example = "Пример: {aura} ({share}) с одной поддержкой при максимальном эйтре {eitr} резервирует {share} × {eitr} + {support} = {total} эйтра."
eitr_circles = "{gifts} вместо этого добавляет свою величину за поддержку; {malice} ещё добавляет {curse} за каждое удерживаемое проклятие и {more} за каждое {heavy} на удерживаемом проклятии."
per_link = "За каждый соседний"
per_support = "+{n} за поддержку"
per_curse = "+{n} за удерживаемое проклятие"
curses_title = "Проклятия"
curse_limit = "Один игрок держит на каждом враге {base} проклятие; {nodes} повышает это число (не больше {limit_max}). Проклятия других игроков в ваш предел не входят."
curse_store = "Проклятие, которое вы уже держите на враге, обновляется: длится до более позднего конца и сохраняет более сильное значение. Новое сверх предела заменяет ваше самое старое; проклятие от {malice} в таком случае просто не накладывается."
curse_value_formula = "значение проклятия = его значение на его ранге × (1 + усиление эффекта проклятий + {heavy}), не больше {max}%"
curse_value_terms = "Эффект проклятий усиливают, например, пассивы {nodes}."
curse_duration_formula = "длительность = 6 с × (1 + увеличение длительности проклятий и эффектов) × «больше» длительности эффектов × {long_seal} × {heavy}, не больше {seconds} с"
curse_duration_terms = "Длительность проклятий увеличивают, например, пассивы {nodes}."
ranks_title = "Ранги и огранка"
ranks_text = "У камня ранг от 1 до {top}. Каждый ранг выше первого добавляет {step}% от значения на ранге 1 к растущим числам (доли урона, лечение, значения проклятий, бонусы поддержек, весь эффект ауры). Шансы, перезарядки, области, количества, длительности, цены, ёмкость и резерв эйтра не меняются."
rank_formula = "значение на ранге r = значение на ранге 1 × (1 + {step}% × (r − 1))"
ranks_rules = "У камня ранг от 1 до {top}. Каждый ранг выше первого что-то меняет:"
rank_grow = "То, что делает камень (доли урона, лечение, значения проклятий, бонусы поддержек, весь эффект ауры), растёт на {step}% от значения на ранге 1."
rank_drawback = "Недостаток (меньший урон, более долгий отдых или большая цена поддержки; то, что аура делает со своим носителем) смягчается на {soft}% от значения на ранге 1."
rank_count = "Поддержка, добавляющая снаряды, цепи или пробивания ({gems}), даёт {overflow}: +100% за каждое добавление на ранге 1 и +{count}% за каждый ранг выше."
rank_chance = "Шанс активатора ниже 100% растёт на {step}% от значения на ранге 1, но не выше 100%."
rank_sure = "Активатор, срабатывающий всегда ({gems}), вместо этого отдыхает на {cd}% от перезарядки на ранге 1 меньше."
rank_fixed = "Области, дальности, количества, пределы, длительности, перезарядки эффектов, цены, ёмкость и резерв эйтра не меняются, кроме случаев, когда камень делает одно из них своим преимуществом ({gems})."
rank_drawback_formula = "недостаток на ранге r = недостаток на ранге 1 × (1 − {soft}% × (r − 1))"
rank_count_formula = "избыточный шанс на ранге r = 100% × добавляемое на ранге 1 + {count}% × (r − 1)"
rank_sure_formula = "перезарядка на ранге r = перезарядка на ранге 1 × (1 − {cd}% × (r − 1)), для активатора, срабатывающего всегда"
auras_title = "Ауры в работе"
aura_strength_formula = "сила ауры = (1 + увеличение эффекта аур) × больший эффект аур × (1 + эффект её поддержек) × (1 + {step}% × (ранг − 1))"
aura_strength_terms = "Сила умножает собственные числа ауры (рунный щит, регенерацию, стойкость, урон ядом) и то, что даёт Круг даров. {inner} добавляет к эффекту её поддержек; {wide} отнимает от эффекта ауры, не наносящей урона."
aura_inner = "Аура с поддержкой {inner} действует только на своего носителя: союзники рядом ничего не получают."
aura_gifts = "{gifts} даёт каждую поддержку рядом в форме ауры ([формы аур]({forms})): её усиления × сила круга × (1 + {step}% × (ранг поддержки − 1)); избыточные шансы зависят только от ранга поддержки, а недостатки смягчаются с этим рангом."
aura_periodic = "{plague} и {heat} наносят урон со временем, а не удары. Каждые {pulse} с {plague} наносит каждому врагу в радиусе {pulse} с своего урона ядом в секунду. Полученный урон огнём запускает {heat}: пока длится эффект, каждые {tick} с наносится {tick} с доли камня от огня, полученного за последнюю секунду. Эти тики нельзя заблокировать или избежать, они не оглушают и не отталкивают; учитываются увеличение и больший урон персонажа, вместе с его уроном по области, уроном со временем и уроном аур (и заклинаний — для камня с тегом «Заклинание»)."
stats_title = "Камни и ваши характеристики"
stats_text = "Эффект камня учитывает собственные характеристики персонажа по тому, чем он является: увеличение урона и урон его вида (по области, снарядами, заклинаниями — для камня-заклинания), область действия, длительность эффектов, дополнительные снаряды, пробивание и цепи, скорость снарядов и отбрасывание. Числа его поддержек (избыточный шанс, увеличение области, большая длительность) складываются в те же суммы, что и собственные характеристики персонажа, а его удары затем проходят через правила ударов персонажа, как любые другие."
rank_level_text = "Ранг неогранённого камня зависит от уровня существа или сундука, из которого он выпал: 1 + ⌊уровень ÷ {step}⌋, не больше 5."
cutting_text = "Правый клик по неогранённому камню открывает окно огранки: {trigger} гранится в любой активатор, {effect} — в любой эффект, проклятие или ауру, {support} — в любую поддержку. Камень получает ранг неогранённого. Вместо огранки тот же неогранённый камень может поднять один камень своего вида — в сумке или на доске — на один ранг, не выше своего ранга."
boss_gems = "Камни боссов"
boss_gems_intro = "Их гранят только после того, как их босс побеждён в мире (или этим персонажем):"
boss = "Босс"
