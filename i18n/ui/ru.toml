[formula.summoning-staves]
title = "Посохи призыва"
text = "{minions}: посох призыва вызывает перед вами раба, который следует за вами и сражается за вас. Призыв стоит только выносливость; раб держит эйтр, пока жив (ниже)."
staff = "Посох"
thrall = "Раб"
life = "Время жизни"
eitr = "Держит эйтра"
stamina = "Выносливость за призыв"
bench = "Уровень верстака"
cast = "Каждый призыв вызывает одного раба. Предела на число одновременно нет: их ограничивает только ваш свободный эйтр."
