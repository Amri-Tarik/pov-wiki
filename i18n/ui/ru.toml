# Halls of Oaths: maps built from room items (halls_pages.py).
[halls]
title = "Чертоги клятв"
how = "Как устроены чертоги"
intro = "Чертоги клятв — подземелья, которые вы задумываете сами. У врат чертогов вы раскладываете [предметы-комнаты]({rooms}) на доске Книги чертогов, упаковываете их в карту, зачаровываете её рунами на [модификаторы карты]({modifiers}) и запускаете. Подземелье строится в точности по плану, а его финальный босс даёт пару очков посвящения."
gates = "Врата и вестибюли"
gates_text = "Врата Чертогов клятв стоят в мире. Уровень врат — уровень земли вокруг них: он задаёт размер доски, уровень врагов и ступень карты. Используйте врата, чтобы войти в их вестибюль, или удерживайте дополнительную клавишу (Shift), чтобы открыть собственный вестибюль."
lobby_text = "Вестибюль — безопасный зал в стиле биома врат. В нём лежит {book}, стоит торговец комнатами {merchant} и находится большая дверь в подземелье."
hugin = "Хугин ждёт над книгой с {n} подсказками:"
book_title = "{book}"
board_text = "Книга раскладывает доску из клеток. Вход — в нижнем ряду, клетка финального босса — единственная клетка верхнего ряда; остальные клетки открыты или закрыты случайно, и по любой доске можно пройти от входа до клетки под боссом. Число открытых клеток растёт с уровнем врат:"
board_formula = "открытых клеток = {low} при уровне врат {from_} и ниже, равномерно до {high} на уровне {to}; ширина доски — √(клетки ÷ {open}) с округлением"
