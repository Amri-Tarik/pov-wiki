item_intro = "What each Lord's Brand that can ascend this item makes of it, at quality 1 (in brackets: what each quality adds; ascending sets the quality back to 1, and an upgraded item keeps at least what it had). How it works: [{title}]({link})."
brand_link = "Ascends a piece of equipment to {biome} (item level {level}): see [{title}]({link})."
title = "Ascension"
text = "A Lord's Brand, dropped by bosses, ascends a piece of equipment to a later biome, once per item and only upward: the item's own biome (that of the highest-level material in its recipe; a staff's thrall's; a unique item's, that of its item level or of the unique's own level, whichever is higher) must come before the brand's."
essence = "Brand"
