[formula.preset]
vanilla = "Vanilla"
easy = "Easy"
normal = "Normal"
hard = "Hard"
merciless = "Merciless"

[formula.pen]
armour = "Armour ignored"
resist = "Resistance ignored"

[formula.creature-level]
title = "Area levels"
text = "Every biome has a fixed level. A creature's level is the level of the biome it stands in (stars don't change it): it sets the creature's accuracy and the item level of its loot, a chest takes the level of its biome, and gear bought from a trader the level of the biome the trader is in. It doesn't scale health or damage, except for the monolith bosses. With the Raid level scaling setting (off by default, on in Merciless), raiders take the level of the biome the raid comes from, and scale with it. Each biome also has a recommended player level: up to the next biome's, it gives full experience; past it, experience [falls off]({falloff})."
full_col = "Full experience up to level"

[formula.creature-strength]
title = "Health and damage"
text = "A creature's health and damage are Valheim's own, multiplied by these factors:"
health = "Health = base health × biome × (1 + star bonus × stars) × tamed × Monster Power × Blight Mist"
damage = "Damage = base damage × biome × (1 + star bonus × stars) × tamed × Monster Power × Blight Mist"
terms = "Biome: the factor of the creature's biome (table below; bosses use the boss columns). Stars: see [Stars]({stars}). Tamed: a tamed creature has {tamed} of it. Monster Power: see [Monster Power]({power}). Blight Mist: only inside a mist. Valheim's own world difficulty settings apply on top."
boss_health = "Some bosses get one more health factor on top: {bosses}."
species = "Some kinds have their own health factor, which replaces the biome's: {species}."
soften = "factor = 1 + (biome factor − 1) × scale"
fixed = "These keep their own health: {creatures}."
summons = "{minions}: your summons scale on their own, see [summon strength]({link})."
[formula.boss-step]
title = "After a biome's boss"
text = "Once a biome's boss has been defeated, the creatures of that biome move part of the way toward the next biome's factors (health, damage and penetration): {near} near the world centre, up to {far} far from it. Bosses don't step up, and nor does the Deep North."
formula = "step = {near} + ({far} − {near}) × t,   t = (distance from the world centre − near) ÷ (far − near), from 0 to 1"
species = "Wolves and Draugr keep their own health factor, so only their damage steps up."

[formula.stars]
title = "Stars"
text = "Stars make a creature stronger, set its [rarity]({rarity}) and bring modifiers."
health = "Health × (1 + {h} × stars)"
damage = "Damage × (1 + {d} × stars)"
chance = "Each star step has a {chance} chance (Valheim: 10%), rolled until it fails, up to two stars; hostile creatures in their home biome can always reach {home}. A creature with two stars then gains another star with a {above} chance each time, up to the preset's most stars. Each star brings {mods} modifier. Chances of the first roll:"

[formula.boss-stars]
title = "Boss stars"
text = "A boss summoned at its altar can rise with stars: a {chance} chance of at least one star, and {two} of two (part of the {chance}). By default, only once that boss has been defeated in the world. Runes of the Blood Challenge (up to {max}) offered at a boss altar, Valheim's or that of one of the mod's [bosses]({bosses}), give the next boss summoned there one star each instead of the roll, even before its first defeat, with at least one modifier per star."
health = "Health × (1 + {h} × stars)"
damage = "Damage × (1 + {d} × stars)"
notes = "Modifiers per boss star: {mods} on Normal, 1 on Hard and Merciless."

[formula.monster-power]
title = "Monster Power"
text = "Offering boss trophies at an Altar of Power makes the creatures of that biome stronger, and their loot richer:"
formula = "Monster Power = 1 + {step} × offerings, at most ×{max}"
notes = "It multiplies the health and damage of the biome's wild creatures, bosses included (not tamed ones), and adds Monster Power − 1 to their [loot quantity]({loot}). It reaches its maximum after {n} offerings; each offering costs one trophy more than the last."

[formula.loot]
title = "Loot"
text = "When a creature dies, its Path of Valheiman loot is rolled with two numbers, {quantity} and {rarity}:"
quantity = "Quantity = 1 + item quantity + {star} × stars + {mod} × modifiers + (Monster Power − 1)"
rarity = "Rarity = item rarity + {star} × stars"
star_scale = "On a difficulty preset with more stars than Normal, creatures and elites (not bosses or chests) give less per star: the star and modifier terms of quantity and rarity are × the preset's star share, and their quantity × its quantity factor, so that loot per area stays near Normal's:"
star_share = "Star share"
quantity_share = "Quantity factor"
notes = "Item quantity and item rarity are the killer's own, from passives and gear. Modifiers and Monster Power add quantity, not rarity. A kill by one of your summons, companions or pets counts as yours. The loot's item level is the creature's level; uniques and jewels keep it too (shown with Alt)."
sources = "Drops per kill"
sources_note = "Each kind rolls its own number of drops: on average this many × quantity."
lambda = "Drops on average"
jewel = "Jewels"
by_level = "Rarity by item level"
by_level_note = "Gear never drops common: it is magic or rare, by these weights, which rarity shifts toward rare. Base jewels can also drop common, with a weight of {white} of the magic one (after rarity):"
curve = "c = rarity ÷ (1 + rarity);   magic × (1 + c),   rare × (1 + 2c)"
common = "Common"
magic = "Magic"
rare = "Rare"
unique = "Each gear drop has a {chance} × (1 + c) chance to be a unique instead. Bosses always drop at least a magic item, a rare one from level {level}."
gear = "Equipment"
currency = "Currency"
gates = "By default, a piece of equipment only drops once you know its recipe (all its materials); currency, jewels and uniques have no such gate. Servers can switch each kind off per source (enemies, bosses, chests) and change their rates."

[formula.vanilla-drops]
title = "Valheim drops"
text = "Valheim's own drops (meat, hides...) grow with stars; trophies and single items don't."
star_share = "Except for bosses, the star bonus is × the difficulty preset's [star share]({loot})."
formula = "amount × (1 + {s} × stars), at most {cap}"

[formula.experience]
title = "Experience"
text = "Experience from a kill:"
formula = "Experience = base health × {h} × (1 + {s} × stars + {m} × modifiers)"
notes = "Base health is the Valheim health of its kind. It is shared between the players alive within {radius} m ({boss}× that for bosses). At night, every experience gain is +{night}. Creatures of a runic event give {event}."
sources = "Only combat raises your character level: kills, and the hits of your fighting skills. Everything peaceful (gathering, building, crafting, exploring, travelling) goes to {craft} instead, and the [experience fall-off]({falloff}) never cuts it."

[formula.attributes]
title = "Attributes"
text = "Each point of an attribute gives:"
attribute = "Attribute"
per_point = "Per point"
per_hundred = "Per 100 points"
increased = "{x} increased {term}"
increased_regen = "{x} increased {term} regeneration"
plus = "+{x} {term}"
skill = "Weapons governed by attributes multiply their damage by a random {factor}, picked anew for every hit between its midpoint − {spread} and + {spread}, never below 0. The midpoint grows with the weapon's governing attribute points (with two, their average); Valheim's own weapon skill level doesn't count."
formula = "midpoint = {center} × (1 + {coef} × (points ÷ {full})^0.75)"
points = "Points"
midpoint = "Midpoint"
governing = "Governing attributes by weapon skill:"
weapon = "Weapon skill"
governs = "Governing attributes"
scepters = "Sceptres are governed by {str} and {int}, whatever their skill."
shifted = "With {mastery}, {pct} of your {str} also counts as {dex} for two-handed weapons and bows (not fist weapons)."

[formula.crit-multiplier]
title = "Critical strike damage"
text = "{term}s multiply the hit's damage by:"
formula = "{base} + critical damage bonuses, at least 0"
magazine = "On a crossbow's last loaded shot ([magazine]({magazine})), if you have critical damage increases for that shot, the multiplier is 1 + ({half} + flat critical damage bonuses) × (1 + every critical damage increase that applies to the shot) × more critical damage: the increases then multiply the base too."
notes = "The bonuses come in parts, each its flat bonuses × (1 + increases): general ones, those for your weapon kind, for the target, and for the alternative attack. The parts are computed separately and added up, so a general \"reduced critical damage\" doesn't lower your weapon's own bonus."

[formula.crit-chance]
title = "Critical strike chance"
text = "Critical strike chance starts from the weapon's base:"
formula = "chance = (base + flat) × (1 + increases) × more, at most the maximum"
bases = "Base: knives {knives}, polearms {polearms}, other weapons {other}, spells {spells}. The weapon's own critical chance properties apply to its base first. The maximum is {ceiling} by default."

[formula.evasion]
title = "Evasion"
text = "{evade} gives a chance to avoid a hit, which depends on the attacker's accuracy ({accuracy}), growing with its level and stars:"
accuracy = "accuracy = ({base} + {per} × level) × (1 + {star} × stars)"
chance = "evade chance = evasion ÷ ({ratio} × accuracy), at most {cap}"
notes = "Each hit is rolled on its own. Every hit you evade lowers your chance against that attacker: × {decay} per evasion, until it goes {reset} s without hitting you ({boss} s for a boss). Each evasion costs {stamina} of your maximum stamina, less with cost reductions for evading; with less stamina than that, you can't evade. Damage over time in an area can't be evaded. Chance against creatures without stars, before any evasion, by biome:"
acc_col = "Accuracy"
rating_col = "{n} evasion"

[formula.resistances]
title = "Resistances"
text = "{term} reduce damage of their type: damage × (1 − resistance)."
formula = "resistance = min(cap, your resistance − enemy penetration);   cap = {cap} + maximum resistance, at most {hard}"
notes = "Fire, frost and lightning also count elemental resistance. Penetration can take resistance below zero, which increases the damage taken."

[formula.enemy-penetration]
title = "Enemy penetration"
text = "Creatures pierce your defences by their biome: with flat {armour} and {resist} (a share of your resistances). Your armour counts for {effect} against creatures' hits."
notes = "Bosses move toward the next biome's values. Creatures with the {piercing} modifier ignore more."

[formula.strikes]
title = "Additional strikes"
text = "{strike}: a melee weapon's vertical swing, primary or alternative (horizontal swings and thrusts don't count, whatever their animation); slams and sceptres don't count. Once a swing hits an enemy, it hits again as many times as your additional strikes, one every {interval} s. Each goes to the nearest enemy not struck yet, within {radius} m of the first target and {reach} m of you; when there is none left, they stop."
formula = "additional strikes = ⌊additional strikes⌋, ×2 once after a critical strike ({double})"
hits = "Each additional strike is a new hit of the same attack: it rolls its own critical strike and gets all your damage bonuses. Strike bonuses apply to the swing and to every additional strike."
double = "With {double}, the attack's first critical strike, from the swing or from one of its strikes, doubles its additional strikes, once per attack."
focus = "With {focus}, every additional strike hits the first target instead, at {pct} damage each, and they stop if it dies or gets out of reach."
combo = "{combo} counts one hit per attack: additional strikes and phantom strikes never add to it."
bases_primary = "Primary attacks that are strikes: {items}."
bases_secondary = "Alternative attacks that are strikes: {items}."

[formula.phantom-strikes]
title = "Phantom strikes"
text = "{phantom} can follow a melee attack hit: the weapon's own blow or one of its additional strikes, not projectiles, area blows or other copies. Each hits a random enemy within {radius} m of the struck one, that one included: the first {delay} s after the hit, then one every {interval} s."
count = "phantom strikes per hit = ⌊chance⌋, +1 with a probability of what is left"
formula = "phantom strike damage = {share} × the hit's damage without its critical strike"
damage = "The hit's damage is taken with all your damage bonuses applied but its {crit} taken out, before the enemy's armour and resistances. A phantom strike doesn't get your bonuses again, but it rolls a critical strike of its own: your weapon's crit chance against the enemy it hits (with rows for phantom strikes), and your weapon's crit multiplier. The enemy's armour and resistances apply to it as usual."
stagger = "{stagger}: a phantom strike carries {share} of the hit's stagger, with the stagger build-up that works with phantom strikes in place of the hit's own."
ailments = "{gauge}: phantom strikes don't fill it. Their fire, poison and spirit damage hits at once instead of over time, and their frost and lightning bring no chill or shock."
chain = "With {recursion}, a phantom strike that lands can cause more: the n-th generation's chance is the first's × the factor its line gives, to the power n − 1. At most {max} phantom strikes wait at once."

[formula.rune-shield]
title = "Rune shield"
text = "{shield} is a layer over your health. Of a hit that gets through {block}, resistances and armour, it takes everything but spirit and poison damage until it runs out; the rest goes to your health. While it holds, {stagger} you take is cut by {guard}."
formula = "maximum = (base + flat + armour's rune shield + food + from health) × (1 + increases)"
notes = "The base is {base} by default (a server setting): only the tree, gear and food give a shield. Stats that turn health into shield give maximum health × p ÷ (1 − p) for a share p, at most {cap}."
ward = "Valheim's shield effects (such as the Staff of Protection's) become a ward on whoever gets them: it takes Valheim's amount of damage, everything but spirit and poison, for Valheim's duration (on you, longer with buff duration, at most × 3). While a ward holds, {stagger} taken is cut by {guard} too."
recharge = "Damage you take restarts the wait. After {delay} s without damage, it recharges {rate} of its maximum per second ({full} s from empty), faster with shield regeneration. Recharge delay reductions cut the wait by at most {cap}, never below {floor} s."

[formula.stagger]
title = "Stagger"
text = "{stagger} fills from a hit's blunt, slash, pierce and lightning damage, as the target takes it. At its threshold, maximum health × the creature's own stagger factor, the target staggers. The gauge then drains: from full in {drain} s for players, {enemy} s for enemies (the mod slows it)."
formula = "your hit's stagger = (damage × {share} + flat) × (1 + stagger {buildup}) × the weapon's stagger multiplier"
yours = "Your hits carry {share} of the {power} Valheim gives them (a server setting); stagger build-up multiplies it and flat stagger build-up adds to it."
forced = "{forced}: when it rolls, the hit's stagger is multiplied by 100."
shield = "Your own threshold counts {share} of your maximum {shield} as health, and your gauge drains that much faster, so it still empties in the same time."
taken = "Stagger you take: × (1 − {res}), which is at most {cap}; cut by {guard} while your {shield} holds. Stagger recovery drains your gauge faster."

[formula.block]
title = "Block"
text = "{block}: when you block a hit from the front, Valheim treats your block power like armour against the whole hit, every damage type, after the blocking item's own resistances."
power = "block power = max(0, Valheim's block power × (1 + the shield's own block power increases) + flat block power) × (1 + block power increases)"
base = "Valheim's block power = the item's block power at its quality × (1 + Blocking skill × {skill})"
parry = "parry: block power × the item's parry bonus × (1 + parry bonus increases)"
parry_text = "A parry is a block within {window} s of raising your guard, with an item that has a parry bonus. A block costs Valheim's block stamina × the share of your block power the hit used; a parry costs a fixed amount."
blocked = "What gets through works like {armour}: block power under half the hit takes that much off; more than that cuts the hit to hit² ÷ (4 × block power). The rest goes on to your armour and rune shield."
guard = "If you're out of stamina, or the blocked hit's {stagger} breaks your guard, nothing is blocked. A hit that meets your block can't be a {glance}."

[formula.glancing]
title = "Glancing blows"
text = "{glance}: any hit a creature lands on you that doesn't meet your block can glance. Everyone has {chance} chance (a server setting), plus glancing blow chance."
cap = "At most {cap}."
formula = "glancing blow: damage taken − {cut} × (1 + glancing blow reduction increases), that cut kept between {lo} and {hi}"
taken = "The cut joins your other damage-taken modifiers, which together can take off at most {floor}. It comes before your resistances, block and armour."
block = "Hits that meet your {block} don't glance; with {guard}, a blocked hit that breaks your guard still can."

[formula.endurance]
title = "Endurance"
text = "{endurance}: while your health is under your endurance threshold, the part of any damage you take below the threshold is reduced, hits and damage over time alike."
formula = "damage taken = damage − (the part of it below the threshold) × endurance reduction"
notes = "Reduction is {base} at base, × (1 + increases), at most {cap}. The threshold is in health points; with {rune} it's compared to your {shield} instead."
order = "It applies last, after your {res}, {block} and {armour}, just before your {shield} takes the damage."

[formula.thorns]
title = "Thorns"
text = "{thorns}: when a creature hits you and you don't evade it, it takes your thorns damage back. The amount doesn't depend on the hit: it's your flat thorns, or {base} if increased thorns are all you have."
formula = "thorns damage = flat thorns × (1 + damage increases + thorns increases + the damage type's increases) × block or parry multiplier × distance"
type = "It's pierce damage, unless your stats convert part of it to other types or add more as extra damage."
range = "Full damage to an attacker within {full} m of you (from its edge), falling to nothing at {zero} m."
block = "On a shield block with {shield}: × {block}. Thorns that work with parries add to a parry's thorns."
contact = "{carapace} also deals your thorns to enemies touching you."

[formula.charged-attacks]
title = "Charged attacks"
text = "{charged}: something charges your next weapon attack, and the next melee or ranged attack you release spends it, hit or miss (spells only with {spells}). One charge waits at a time; it doesn't stack or expire."
formula = "charged attack: + {inc} increased damage, added to your other damage increases, and rows that work with charged attacks apply"
cooldown = "A source charges again only {source} s after it last charged the attack (critical hits: {crit} s). After any charge, every source also waits the shorter of its own cooldown and {shared} s (cut by cooldown recovery). A perfect dodge ignores both cooldowns, but can't charge an attack that's already charged."
alt = "With {only_alt}, only alternative attacks spend the charge; with {no_alt}, alternative attacks don't spend it."
double = "{double}: rolled once when the charge is spent. On success the attack gets {inc} increased damage instead, and every row that works with charged attacks counts twice."
splash = "{splash}: a charged attack's first hit on an enemy also hits every other enemy within {radius} m × (1 + {area} increases), for your splash share of its damage."
sources = "What charges the attack. Each source needs the passive or mastery option that grants it:"
source_col = "Charges the attack when"
granted_col = "Granted by"
on_Crit = "you land a critical hit with an attack"
on_Dodge = "you start a dodge roll (a perfect dodge charges it even on cooldown)"
on_Parry = "you parry a hit"
on_Cast = "you cast a spell"
on_Hit = "an alternative attack hits an enemy"
on_Jump = "you jump"
on_TrinketActivation = "you activate a trinket"
on_Distance = "you cover {distance} m running on the ground or levitating, while no charge waits"

[formula.area]
title = "Area of effect"
text = "{area} widens attacks in a straight line: the factor multiplies the hit radius, not the ground it covers. +100% area doubles the radius and covers four times the ground."
formula = "radius × max({floor}, (1 + area increases) × area multipliers)"
notes = "Area attacks (a {slam} is one) get the wider radius; other swings reach further as well."

[formula.slams]
title = "Slams and aftershocks"
text = "{slam}: Valheim's area attacks (the sledge's swing and others like it) count, and so does an alternative attack {ground} turns into one: it uses the weapon's own area radius, or {radius} m if the weapon has no area attack. Your {area} widens a slam's radius."
aftershock = "{aftershock}: rolled once per slam, at most 100%. {delay} s later it erupts at the slam's point, in the slam's radius × the area increases that only apply to aftershocks, and hits everything there with the slam's full damage. An aftershock never rolls another, though repeat chance can make it erupt once more."
thrown = "A thrown club, mace or sledge that lands on the ground (not on a creature) slams there once: {radius} m × your {area}, with {pct} of the weapon's damage × your {factor}, against every enemy and object in it. A thrown sceptre that lands casts its spell there instead."
push = "An aftershock pushes enemies away from where it erupts."
bases_primary = "Primary attacks that are slams: {items}."
bases_secondary = "Alternative attacks that are slams: {items}."
bases_ground = "Alternative attacks that {mastery} turns into slams: {items}."
charged = "A {charged} that isn't a slam can make aftershocks too, from aftershock chance that works with charged attacks: each full 100% gives one, and the rest is a chance for one more, each {delay} s after the last, where the enemy was hit."

[formula.armour-break]
title = "Armour break"
text = "{brk}: a hit's blunt damage breaks the enemy's armour the way it would fill an {gauge}: blunt against its base health, raised by {buildup}. The broken share adds up to 100% and is shared by everyone hitting the enemy; {seconds} s after the last hit that added to it, it's gone."
fill = "broken share added by a hit = blunt ÷ (ailment threshold × the enemy's base health) × (1 + build-up)"
formula = "your physical damage + the enemy's armour × broken share × (1 + armour break effect increases), that share at most 100%"
notes = "Every hit of yours on an enemy with broken armour gets that added, including the hit that just added to it, spread over its blunt, slash and pierce (as blunt if it has none). It comes before the enemy's {armour}, so it pays back about as much as the armour takes."

[formula.impale]
title = "Impale"
text = "{impale}: a hit's pierce damage can impale the enemy. The chance works like the {gauge}: pierce against the enemy's base health, raised by {buildup}."
chance = "chance = (pierce ÷ (ailment threshold × the enemy's base health) + flat build-up) × (1 + build-up increases), at most 100%"
formula = "physical damage your hits deal × (1 + impales × {stack} × (1 + ailment damage increases))"
notes = "An enemy holds up to {limit} impales (more with impale limit). Each new impale refreshes them all for {window} s × (1 + ailment duration increases), at least {floor} s."

[formula.limit]
title = "Limits"
text = "{limit}: a bonus that names an effect raises only that effect. One that names none raises every limit below at once. Bonuses add up first, and the total is rounded down (but not for the infusion store)."
effect = "Limit"
base = "Base"
per_cast = "Thralls per cast of a summoning staff"
spores = "{spore}s at once"
crystals = "{crystal}s at once"
shards = "Armour shards at once"
impales = "{impale}s one enemy can hold"
links = "{link}s you can hold at once"
ground = "{ground}: patches at once"
infusion = "{infusion}: units stored"
chain = "Chain Lightning's targets ({n}) are the exception: they only count limit bonuses that name Chain Lightning."

[formula.lifesteal]
title = "Life leech"
text = "{leech}: a share of the health your weapon and projectile hits actually remove from an enemy; spells use spell leech. Bleeding, thorns and echoed hits don't leech."
formula = "leeched = health removed × life leech"
rate = "Each hit starts its own leech, which gives back {rate} of your maximum health per second until it's paid out. All of them together give at most {cap} per second, which {n} leeches running at once reach. Reaching full health ends every leech still running."

[formula.hit-damage]
title = "Hit damage"
text = "A hit's damage is built in the parts below; {order} lists them in the order they happen."
see_order = "Every step of a hit, in order: [{title}]({link})."
flat_title = "Flat damage"
flat = "{flat} is added before any increase, × your {factor} (the same one the weapon's own damage gets). Where it goes:"
flat_main = "general flat damage, and flat damage for the kind of hit (your weapon kind, melee, spells, projectiles, attacks, alternative attacks and the like): to the hit's largest damage type"
flat_physical = "flat physical damage: to the largest of slash, pierce and blunt (blunt if the hit has none)"
flat_typed = "flat slash, pierce or blunt damage: only to a hit that already has that type"
flat_element = "flat fire, frost, lightning, poison or spirit damage: always, as that type"
flat_elemental = "flat elemental damage: to the largest of the hit's fire, frost and lightning, only if it has one of them"
oil = "Weapon {oil} add their damage type before flat damage, without the skill multiplier."
harmless = "A hit with no damage at all gets neither oils nor flat damage."
conversion_title = "Conversion"
conversion = "{conversion} turns part of a hit's slash, pierce and blunt damage into another type, after flat damage and before increases; no other type converts. Each of the three converts by its own conversions plus those of all physical damage; if they come to more than 100%, they're scaled down to 100% together."
conversion_target = "Conversion that depends on the enemy (against bosses, enemies with ailments and the like) counts too."
conversion_formula = "converted = slash, pierce or blunt × its conversion to the new type, all its conversions together at most 100%"
converted = "Converted damage is its new type for resistances and ailments, but it grows with the increases of both types: its old type's and its new type's, added together."
gain = "{gain}: worked out from the slash, pierce and blunt damage before conversion, and added after it as its new type. It grows with its new type's increases only."
increases_title = "Increases"
increases = "All the increased and reduced damage that applies to a hit is added into one sum, and the hit is multiplied by 1 + that sum once: general damage, your weapon kind's, melee, ranged or spell damage, attacks', alternative attacks', that of hits that aren't projectiles, a running attack's bonus, and the increases that depend on the enemy (below)."
scepters = "A scepter's hits count as the kind of attack they are: its spells take spell damage increases, its other attacks melee or ranged ones."
increases_formula = "damage of a type = (weapon damage × skill multiplier + oils + flat damage × skill multiplier) × (1 + increases + that type's increases)"
typed = "Each damage type adds its own increases to the sum, for that type only: fire, frost and lightning also add elemental damage increases, and slash, pierce and blunt add physical damage increases. So +50% damage and +50% fire damage make fire damage × 2, not × 2.25."
more_title = "More multipliers"
more = "More (and less) damage multiplies the hit separately, each multiplier after the other: more damage and more damage for your weapon kind, then {rage}: × (1 + {per} per point × (1 + rage effect increases)), not on spells."
projectile = "{proj}: projectile damage increases join the sum too, with the projectile speed increases any of your stats turn into damage, and so do a {torch}'s damage increases."
ammo = "Bows and crossbows split each shot in two parts. The ammo's share is its damage ÷ (the weapon's damage + the ammo's). That part takes the sum without your bow or crossbow damage increases, plus your projectile damage increases (bow or crossbow projectile ones included); the weapon's part takes the sum as it is, without projectile increases."
ammo_formula = "damage = weapon's part × (1 + sum) + ammo's part × (1 + sum − bow or crossbow increases + projectile increases)"
resources = "Chopping and mining: increases against trees, ore and resources join the same sum, and so flat damage against them grows with the whole sum."
more_projectile = "More (and less) projectile damage then multiplies {proj} on its own."
target_title = "Against the enemy"
target = "When the hit reaches an enemy, the increases that depend on it join the same sum:"
target_kind = "increases against enemies of a kind or in a state (bosses, enemies with ailments and the like)"
target_backstab = "{backstab}: against an enemy that hasn't noticed you; Valheim's own backstab bonus is turned off"
target_stagger = "+{x} while the enemy is staggered, instead of Valheim's double damage ({stagger})"
target_charged = "{charged}: +{x}"
target_flat = "Flat damage against the enemy (flat backstab damage, flat damage against enemies of a kind) goes to the hit's largest type, × your skill multiplier × (1 + the whole sum). It comes after the {crit}, so a crit doesn't multiply it."
target_both = "Last come the increases and more multipliers that need something of the hit and something of the enemy together; the increases join the same sum."

[formula.hit-order]
title = "Order of a hit"
text = "Every hit of yours, weapon or spell, goes through these steps in this order. Increases all go into one sum wherever they come from, so their place changes nothing; the places of flat damage and multipliers do matter."
made = "When you make the hit"
lands = "When it reaches the enemy"
base = "Valheim's damage of the weapon at its quality, × the attack's own multiplier (a combo's last hit and the like) × your {factor}."
oil = "Weapon {oil} add their damage."
flat = "{flat}, × the skill multiplier."
conversion = "{conversion}, then {gain}."
ammo = "Bows and crossbows: the ammo's share of the damage swaps your bow or crossbow damage increases for projectile damage increases."
increases = "{increases}: × (1 + their sum), each damage type with its own."
more = "{more}, one after another, {rage} last."
projectile = "More {proj} damage."
crit = "{crit}: × its multiplier, on the whole hit."
target = "Increases {target} join the sum; then flat damage against the enemy, which the crit doesn't multiply."
both = "Increases and more multipliers that need the hit and the enemy together."
physical = "{brk} adds to the hit's physical damage, and {impale} multiplies it."
falloff = "Bows and crossbows: {falloff}, × its factor."
resist = "Valheim applies the creature's resistances, with {pen} for fire, frost, lightning and poison."
notes = "So flat damage grows with every increase and multiplier after it, increases only add to each other, and a critical strike multiplies everything except flat damage against the enemy."

[formula.player-penetration]
title = "Your penetration"
text = "Valheim gives each creature a step of resistance against each damage type. Your {pen} against fire, frost, lightning and poison (elemental penetration counts for the first three) adds to the share of the damage that gets through:"
formula = "damage dealt = damage × max(0, 1 − resistance + penetration)"
modifier = "Creature's step"
resistance = "Resistance"
taken = "Damage dealt"
with = "With {x} penetration"
very_weak = "Very weak"
weak = "Weak"
slightly_weak = "Slightly weak"
normal = "Normal"
slightly_resistant = "Slightly resistant"
resistant = "Resistant"
very_resistant = "Very resistant"
immune = "Immune"
notes = "Immunity counts as 100% resistance, so penetration lets its own share through an immunity. Against a weakness it adds on top. Physical and spirit damage have no penetration."

[formula.summoning-staves]
title = "Summoning staves"
text = "{minions}: a summoning staff calls a thrall in front of you that follows you and fights for you. A cast costs stamina only; the thrall holds eitr while it lives (below)."
staff = "Staff"
thrall = "Thrall"
life = "Lifetime"
eitr = "Eitr held"
stamina = "Stamina per cast"
bench = "Workbench level"
cast = "Each cast calls one thrall. There's no limit on how many stand at once: only your free eitr limits them."
sacrifice = "Alternative cast, Sacrifice: kills one of your summons, the one under your crosshair (up to {reach} m away) or else the one with the least health. It costs nothing; with no summon around, nothing happens."
quality = "Each staff quality above 1 gives its thralls +{health} health and makes them hold +{eitr} more eitr."

[formula.held-eitr]
title = "Held eitr"
text = "{eitr} a summon holds comes off your maximum eitr while it lives, and eitr above the new maximum is lost."
formula = "eitr held = base × (1 + {q} × (staff quality − 1)) ÷ (1 + reservation efficiency for minions)"
notes = "The divisor is at least {floor}: +100% reservation efficiency halves what a summon holds, −20% makes it hold 25% more. The hold ends when the summon dies or its lifetime ends, and comes back if you log in with your summons still alive."
short = "A summoning staff can't call a thrall unless you have that much eitr free. Valheim's own staves can't be cast at all then."

[formula.summon-lifetime]
title = "Lifetime and withering"
text = "Summons live for a while and wither as they go: their health can't stay above the share of their lifetime they have left."
formula = "lifetime = base lifetime × your effect duration for minions"
wither = "health at most = maximum health × (1 − time alive ÷ lifetime), at least 1"
notes = "When the lifetime ends, the summon leaves. Its time runs on the world's clock, so it keeps passing while you're away."
deathless = "{deathless}: your summons have no lifetime: they don't wither and live until they're killed. If you lose it, the ones still alive get a fresh lifetime from that moment."

[formula.summon-strength]
title = "Summon strength"
text = "Summons don't take a creature's usual scaling: no [stars]({stars}), tamed share, [Monster Power]({power}) or Blight Mist."
formula = "summon health or damage = base × the biome's health factor × summon power"
terms = "The biome is the staff's (in the tables here), with its factor from the [biome table]({stages}), softened by the difficulty preset; health and damage both use the health column. The global enemy offense and defense settings apply too. Health is also × (1 + your minion health increases) and +{quality} per staff quality above 1. Summon power is only for Valheim's staves (below)."
ascended = "A staff [ascended]({asc}) with a boss essence calls its thralls as of the essence's biome when that's later than its own; Valheim's staves too."

[formula.vanilla-summons]
title = "Valheim's summoning staves"
text = "The server setting Vanilla summoning staves (off by default) decides how Dead Raiser, Staff of the Wild, Trollstav and Spirit Caller work."
off = "Off: a cast costs no eitr or health, there's no summon limit, and staff quality no longer changes the summons. Each summon holds eitr, lives and withers like a thrall, and is scaled as a summon of the staff's biome:"
health = "Health ×"
damage = "Damage ×"
on = "On: they work as in Valheim, with eitr and health per cast, a summon limit by staff quality, and summons that stay."

[formula.minion-bonuses]
title = "Your stats for minions"
text = "Your stats for minions reach your summons, and some of them your pets:"
damage = "damage: × (1 + minion damage increases) (pets add tamed damage increases)"
health = "health: × (1 + minion health increases)"
taken = "damage they take: × (1 + minion damage taken), between {lo} and {hi}"
ailments = "ailments on them (burning, poison, frost, shock) last × (1 − minion ailment resistance), at most {ailment} shorter"
managed = "Summons the mod manages also get:"
resists = "their fire, frost, lightning, poison and spirit damage taken cut by minion resistance, at most {resist}"
armour = "minion armour against hits"
speed = "attack speed × (1 + minion attack speed), at least {attack}; movement speed × (1 + minion movement speed), at least {move}"
own_shield = "a shield of minion shield size, which takes damage first and recharges {regen} of itself per second after {delay} s without a hit"
crit = "critical strikes: minion crit chance as a chance, for × ({base} + minion crit damage)"
seek = "they look for enemies within {seek} m × (1 + minion aggression)"
guard = "{guard}: for {seconds} s after you block, your {shield} takes {share} of the damage to your minions."
last = "{last}: damage that would take a minion below 1 health comes off your {shield} instead."
both = "Both protect pets too, and only while your rune shield lasts."
unstable = "{unstable}: the first time a summon drops below {low} health from a hit, it explodes for {share} of its maximum health as fire damage to enemies within {radius} m, and dies."

[formula.ailments]
title = "Ailments"
text = "{gauge}: {bleed}, {burn}, {poison}, {frost} and {shock} each fill their own on the enemy, from the matching part of your hits' damage as the enemy takes it, after its resistances and armour: slash, fire, poison, frost and lightning."
formula = "gauge filled by a hit = {damage} ÷ ({threshold} × the enemy's base health) × (1 + {buildup})"
example = "How much of the gauge one hit fills, by its damage as a share of the enemy's base health (its maximum health without the mod's difficulty scaling):"
share = "Damage ÷ base health"
fill = "Filled, +{amount} {buildup}"
lasts = "At 100% the ailment starts, from the strongest matching hit since the gauge began to fill. The gauge then stays full, so every further matching hit applies the ailment again from its own damage. {hold} s after the last matching hit the gauge drains, {drain} per second. Chill ends when it is empty (at most {total} s after that hit); the other ailments run their own time."
each = "What each ailment does with that damage:"
bleed = "{share} of the slash damage per second for {seconds} s ({total} in all), × your ailment damage multipliers and {dot} (physical). Longer duration adds seconds, so more damage. One bleed per player on an enemy: a new one replaces yours only if it deals at least as much per second."
burn = "{share} of the fire damage per second for {seconds} s ({total} in all), × your ailment damage multipliers and {dot} (fire); fire damage increases don't apply again. Longer duration adds seconds, so more damage. One burn per player on an enemy: a new one replaces yours only if it deals at least as much per second. A wet enemy burns out {wet} times as fast."
poison = "{share} of the poison damage per second for {seconds} s ({total} in all), × your ailment damage multipliers and {dot} (poison), plus any share of the enemy's base health your stats add, spread over the same {seconds} s (ailment damage doesn't raise that part). Longer duration adds seconds. Each player can keep {limit} poisons on an enemy (more with {limitterm} bonuses); past that, a new one replaces your weakest if it would deal more. Skeletons and the Charred take poison damage normally, but their poison gauge fills at half speed; summoned skeletons stay immune."
chill = "Valheim's frost effect, its strength × (1 + your general and chill ailment damage increases); ailment and status duration make it last longer."
shock = "for {seconds} s the enemy takes more damage from every source and builds up {stagger} faster, by the shock's strength. Only the strongest shock on an enemy acts, whoever applied it. Flat ailment damage does nothing for shock."
damage = "matching damage"
gauge_title = "Filling the gauge"
how = "How it works"
one = "{ailment} builds up on the enemy's {gauge} from {damage} as the enemy takes it, after its resistances and armour."
does = "What it does: {text}"
shock_formula = "shock strength = {coef} × (lightning damage ÷ ({threshold} × the enemy's base health))^{exp} × (1 + shock effect increases) × more, at most {max}; under {min}, no shock"
shock_notes = "The lightning damage here is the hit's, before the enemy's resistances and armour."
damaging = "Ailment damage multipliers for burning, poison and bleeding: × (1 + ailment damage increases, general and that ailment's) × their more multipliers; flat ailment damage adds its amount spread over {seconds} s. Each player's ailments tick on their own, once a second."

[formula.build-cost]
title = "Build cost"
text = "Build cost reductions lower each material of a piece, the mod's [buildings]({buildings}) included, by at most {cap}:"
formula = "cost = ⌈amount × (1 − reduction)⌉,   reduction at most {cap}"
notes = "Dismantling gives back only what was paid. When a {refund} saves the materials of a placed piece, dismantling it gives nothing."

[formula.armour]
title = "Armour"
text = "{term} is Valheim's own: it reduces each hit by the same share for all its damage types, much against small hits, less against big ones. With hit damage the sum of the hit's damage types:"
formula = "armour < damage ÷ 2:   damage taken = damage − armour;     otherwise:   damage taken = damage² ÷ (4 × armour)"
effective = "armour against creatures = your armour × {effect} − the creature's armour penetration"
notes = "Armour applies after rune shield and block. Creatures ignore part of it: see [enemy penetration]({pen}). Damage taken, by armour and hit:"
armour_col = "Armour"
hit_col = "Hit of {n}"

[formula.item-level]
title = "Item level"
text = "A dropped item takes the level of the creature that drops it, or of the chest's biome ([area levels]({areas}))."
crafted = "A crafted item's level is the highest level among its materials, by the biome they come from; materials a recipe only needs for upgrades don't count. Moulds count as the Deep North, idols as the biome of their tier (below). Each [item base]({bases}) shows its own. It is the level used when runes add properties to the item: each rune sets it again from the recipe."
gates = "Item level decides which [properties]({mods}) and tiers can roll (each tier has a level range), how rare drops are, and which [uniques]({uniques}) can drop."
idols = "The level each upgrade idol counts as:"
idol_col = "Idol"
ascended = "An item [ascended]({asc}) with a boss essence has at least the level of its new biome."

[formula.experience-falloff]
title = "Experience fall-off"
text = "Past a biome's recommended range, the combat experience you gain there fades. The ranges follow the recommended player levels (a server setting, by default the biomes' levels). The level that counts is yours; the biome is where the creature dies (for kills) or where you stand (for hits). Being below a biome's level costs nothing."
formula = "kept = max({floor}, {floor} ^ (levels past the range ÷ {gap}))"
notes = "Experience fades to {floor} at {gap} levels past the range, and never lower:"
over_col = "Levels past the range"
share_col = "Experience kept"
full_col = "Full experience"
floor_col = "{floor} from level"

[formula.ally-kills]
title = "Kills by allies"
text = "A kill by your {minions}, {pets} or companions gives {share} of a normal kill's experience, shared between the players nearby like any kill's ({boss}× the reach for bosses). If you hit the creature yourself in the last {recent} s, you get the normal kill instead."

[formula.player-levels]
title = "Character level"
text = "Combat experience raises your character level, up to {max}. Each level needs:"
formula = "experience to the next level = {base} × level ^ {exp}, rounded"
next_col = "To the next level"
total_col = "Total to reach"
points = "Each level gives {points} passive point; points also come from other sources."
death = "On death you lose {death} of a level's experience ({term}), never going below the start of your level. Passives can lower the loss."

[gear.rift]
title = "How it works"
targets = "When it drops, its line points at one of the tree's portals, picked at random:"
hidden = "normally revealed only to the {classes} ascendancy class"
text = "Socketed in an allocated socket (once identified), it turns the hidden node beside the socket into a portal, the Rift of the Eye. Like every portal, the rift connects to all the others, so the path can go on from there. The portal it points at is revealed too, even without its ascendancy class. Take the jewel out and the rift closes; that portal is unallocated again if it would be hidden."

