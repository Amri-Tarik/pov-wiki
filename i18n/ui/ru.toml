blood = "{blood}: ваши призванные держат здоровье вместо эйтра, {rate} здоровья за единицу эйтра. Оно вычитается из вашего максимума здоровья, который остаётся не меньше 1, а здоровье сверх нового максимума теряется. Посох призыва тогда вызывает раба, только если после этого останется хотя бы 1 максимума здоровья; посохи Valheim так же. С {vessel} они держат эйтр. Горный колокол всегда держит эйтр."

[formula.summon-lifetime]
title = "Время жизни и увядание"
text = "Призванные живут ограниченное время и увядают: их здоровье не может быть выше оставшейся доли времени жизни."
formula = "время жизни = базовое время жизни × ваша длительность эффектов для приспешников"
wither = "здоровье не больше = максимум здоровья × (1 − прожитое время ÷ время жизни), не меньше 1"
notes = "Когда время жизни кончается, призванный уходит. Его время идёт по часам мира, так что идёт и пока вас нет."
deathless = "{deathless}: у ваших призванных нет времени жизни: они не увядают и живут, пока их не убьют. Если вы его теряете, ещё живые получают новое время жизни с этого момента."

[formula.summon-strength]
title = "Сила призванных"
text = "Призванные не получают обычного масштабирования существ: ни [звёзд]({stars}), ни доли приручения, ни [Силы монстров]({power}), ни Тумана скверны."
formula = "здоровье или урон призванного = база × множитель здоровья биома × сила призыва"
terms = "Биом — биом посоха (в таблицах здесь), его множитель — из [таблицы биомов]({stages}), смягчённый пресетом сложности; и здоровье, и урон берут столбец здоровья. Глобальные настройки атаки и защиты врагов тоже действуют. Здоровье также × (1 + ваши увеличения здоровья приспешников) и +{quality} за каждый уровень качества посоха выше 1. Сила призыва есть только у посохов Valheim (ниже)."
skeleton = "Здоровье скелета также × (1 + ваши бонусы здоровья скелетов), отдельным множителем ([ваши характеристики для приспешников]({bonuses}))."
ascended = "Посох, [возвышенный]({asc}) Клеймом владыки, призывает рабов как существ биома клейма, если он позже собственного; посохи Valheim тоже."
roots = "Корни, которые выращивает посох, масштабируются как его призванные."

[formula.vanilla-summons]
title = "Посохи призыва Valheim"
text = "Настройка сервера «Vanilla summoning staves» (по умолчанию выключена) решает, как работают Поднимающий мёртвых, Посох дикой природы, Тролльстав и Зовущий духов."
off = "Выключена: призыв не стоит ни эйтра, ни здоровья, и предела призванных нет. Каждый призванный держит эйтр, живёт и увядает как раб, как и раб получает +{health} здоровья за каждый уровень качества посоха выше 1 и масштабируется как призванный биома посоха:"
health = "Здоровье ×"
damage = "Урон ×"
on = "Включена: они работают как в Valheim — эйтр и здоровье за призыв, предел призванных по качеству посоха, призванные не уходят."

[formula.minion-bonuses]
title = "Ваши характеристики для приспешников"
text = "Ваши характеристики для приспешников действуют на ваших призванных, а часть — и на питомцев:"
damage = "урон: × (1 + увеличения урона приспешников) (питомцам добавляются увеличения урона приручённых)"
low_damage = "пока у призванного меньше {low} здоровья, к его ударам добавляются и ваши бонусы урона приспешников, действующие при низком здоровье"
health = "здоровье: × (1 + увеличения здоровья приспешников)"
skeleton = "скелеты (рабы посохов призыва мода, скелеты Посоха мертвеца): урон × (1 + бонусы урона скелетов) и здоровье × (1 + бонусы здоровья скелетов), каждое отдельным множителем"
taken = "получаемый ими урон: × (1 + получаемый урон приспешников), от {lo} до {hi}"
ailments = "недуги на них (горение, яд, холод, шок) длятся × (1 − сопротивление недугам приспешников), не больше чем на {ailment} короче"
managed = "Призванные, которыми управляет мод, также получают:"
resists = "получаемый ими урон огнём, холодом, молнией, ядом и духом снижается сопротивлением приспешников, не больше {resist}"
armour = "броню приспешников против попаданий"
regen = "регенерацию здоровья: плоская регенерация здоровья приспешников восстанавливает эту долю их максимума здоровья в секунду"
speed = "скорость атаки × (1 + скорость атаки приспешников), не меньше {attack}; скорость движения × (1 + скорость движения приспешников), не меньше {move}"
own_shield = "щит размером со щит приспешников, который первым принимает урон и восстанавливает {regen} себя в секунду через {delay} с без попаданий"
crit = "критические удары: базовый шанс {chance}, повышаемый шансом крита приспешников (плоским и увеличениями), не более 100%, на × ({base} + урон крита приспешников)"
seek = "они ищут врагов в пределах {seek} м × (1 + агрессия приспешников)"
guard = "{guard}: {seconds} с после вашего блока {shield} принимает {share} урона по вашим приспешникам."
last = "{last}: урон, который опустил бы приспешника ниже 1 здоровья, вместо этого принимает ваш {shield}."
both = "Оба защищают и питомцев, и только пока держится ваш рунный щит."
pet_resists = "{pets} получают урон огнём, холодом, молнией, ядом и духом, сниженный вашим сопротивлением питомцев, а компаньоны ({companions}) — ещё и сопротивлением компаньонов, всего не больше {pet_resist}."
unstable = "{unstable}: когда призванный впервые падает ниже {low} здоровья от попадания, он взрывается, нанося {share} своего максимума здоровья огнём врагам в пределах {radius} м, и умирает."
unstable_steel = "{steel} не взрывается."
throne = "{throne}: ваш единственный скелет также считается вашим компаньоном ({companion}): ваши бонусы компаньонов к урону, здоровью, получаемому урону, броне, регенерации и сопротивлению действуют и на него. Самоцвет даёт скелетам ×{damage} урона и ×{health} здоровья."

[formula.ailments]
title = "Недуги"
text = "{ailment}: каждый возникает от соответствующей части урона ваших попаданий в том виде, в каком его получает враг после своих сопротивлений и брони: {bleed} — от рубящего, {burn} — от огня, {poison} — от яда, {frost} — от холода, {shock} — от молнии. Горение и шок бросают шанс по слоям, которые недавние попадания оставили на враге, кровотечение и отравление — свой шанс при каждом попадании, а охлаждение заполняет шкалу."
layers_title = "Горение и шок: слои"
layer_formula = "{layer} от попадания = {per} × {damage} ÷ ({threshold} × базовое здоровье врага) × (1 + {buildup}) × «больше»"
flammability = "воспламеняемость"
conductivity = "проводимость"
layers = "Каждое попадание огнём оставляет на враге слой воспламеняемости, а каждое попадание молнией — слой проводимости, каждый на {seconds} с. Затем попадание поджигает или шокирует с шансом, равным сумме всех слоёв этого вида на враге, включая его собственный, но не больше 100%, плюс ваш плоский шанс поджога или шока × (1 + {buildup}) × «больше». Базовое здоровье — максимальное здоровье врага без масштабирования сложности мода."
layer_example = "Слой от одного попадания по его урону как доле базового здоровья врага:"
layer_row = "{layer}, +{amount}: {buildup}"
tar = "Враг в смоле считается воспламеняемым на {tar} больше (слои и смола вместе не больше 100%); на враге с эффектом «{wet}» каждый слой воспламеняемости × {share}."
ground = "{ground}, которые поджигают или шокируют, добавляют слои так же и накладывают свой недуг, когда слои на враге достигают {share}."
chance_title = "Кровотечение и отравление: шанс"
chance_formula = "шанс = плоский шанс × (1 + {buildup}) × «больше»"
chance_formula_base = "шанс = ({base} + плоский шанс) × (1 + {buildup}) × «больше»"
chance = "Каждое попадание с рубящим уроном или ядом бросает свой шанс кровотечения или отравления; размер урона на шанс не влияет. Базового шанса нет: его дают плоский шанс кровотечения или отравления и плоский шанс недугов, а {buildup} его повышает."
chance_base = "Каждое попадание с рубящим уроном или ядом бросает свой шанс кровотечения или отравления; размер урона на шанс не влияет. Базовый шанс кровотечения — {bleed}, отравления — {poison}; его повышают плоский шанс и {buildup}."
stacks = "Попадание вызывает не больше одного кровотечения. Для яда каждые полные 100% шанса наверняка накладывают одно отравление, а остаток — шанс ещё одного; каждое — от урона ядом этого попадания."
pierce = "С характеристикой, позволяющей колющему урону вызывать кровотечение, {share} колющего урона попадания считается рубящим для кровотечения."
gauge_title = "Охлаждение: шкала"
apply_title = "Наложение недугов"
formula = "заполнение шкалы попаданием = {damage} ÷ ({threshold} × базовое здоровье врага) × (1 + {buildup})"
example = "Какую часть шкалы заполняет одно попадание, по его урону как доле базового здоровья врага:"
share = "Урон ÷ базовое здоровье"
fill = "Заполнено, +{amount}: {buildup}"
lasts = "На 100% начинается охлаждение — от сильнейшего попадания холодом с начала заполнения шкалы. Затем шкала остаётся полной, так что каждое следующее попадание холодом снова накладывает охлаждение от своего урона. Через {hold} с после последнего попадания холодом шкала убывает на {drain} в секунду; охлаждение кончается, когда она пуста (не позже чем через {total} с после того попадания)."
counted = "Рунный оберег на враге не уменьшает урон, который учитывают недуги: они считают попадание так, будто оберега нет (урон ядом и так проходит сквозь обереги). Для кровотечения, охлаждения и шока дополнительный урон, который враг получает от шока, не учитывается."
each_title = "Что делает каждый недуг"
bleed = "{share} рубящего урона в секунду в течение {seconds} с ({total} всего), × ваши множители урона недугов и {dot} (физический). Длительность добавляет секунды, а значит, и урон. Одно кровотечение от каждого игрока на враге: новое заменяет ваше, только если наносит в секунду не меньше."
bleed_bases = "Удары в ближнем бою с {items} базово вызывают кровотечение на {seconds} с."
burn = "{share} урона огнём поджигающего попадания в секунду в течение {seconds} с ({total} всего), × ваши множители урона недугов и {dot} (огонь); увеличения урона огнём повторно не действуют. Длительность добавляет секунды, а значит, и урон. Одно горение от каждого игрока на враге: новое заменяет ваше, только если наносит в секунду не меньше. На мокром враге горение догорает в {wet} раз быстрее."
burn_spirit = "С {jewel} ваше горение наносит урон духом вместо урона огнём, × ваш {dot} для духа."
poison = "{share} урона ядом в секунду в течение {seconds} с ({total} всего), × ваши множители урона недугов и {dot} (яд), плюс доля базового здоровья врага от ваших характеристик, распределённая на те же {seconds} с (урон недугов эту часть не увеличивает). Длительность добавляет секунды. У каждого отравления свой таймер, и каждый игрок может держать на враге до {limit} (больше с бонусами {limitterm}); сверх этого новое заменяет ваше самое слабое, если нанесёт больше. Скелеты и Обугленные получают урон ядом обычно, но шанс отравить их вдвое ниже; призванные скелеты по-прежнему неуязвимы."
chill = "эффект холода Valheim, его сила × (1 + ваши увеличения урона недугов — общие и охлаждения); длительность недугов и эффектов продлевает его."
shock = "на {seconds} с враг получает на {base} больше урона из любых источников и на ту же долю быстрее накапливает {stagger}. Эффект шока повышает это, не больше {max}; урон попадания на него не влияет. На враге действует только сильнейший шок, кто бы его ни наложил. Плоский урон недугов на шок не влияет."
shock_formula = "шок = {base} × (1 + увеличения эффекта недугов и эффекта шока) × «больше», не больше {max}"
shock_notes = "Увеличения урона недуга шока считаются эффектом шока. Длительность недугов и эффектов продлевает его."
how = "Как это работает"
does = "Что делает: {text}"
damaging = "Множители урона недугов для горения, отравления и кровотечения: × (1 + увеличения урона недугов — общие и этого недуга) × их множители «больше»; плоский урон недугов добавляет свою величину, распределённую на {seconds} с. Недуги каждого игрока тикают отдельно, раз в секунду."
speed = "{speed}: × (1 + её увеличения — общие и этого недуга) × «больше», не меньше × {floor}. Горение, отравление и кровотечение наносят урон в секунду × столько и кончаются во столько же раз быстрее, так что общий урон не меняется."
doom = "С {doom} недуги накладывают только критические удары, а периодический урон этих недугов × ваш множитель критического удара."

[formula.build-cost]
title = "Стоимость строительства"
text = "Снижение стоимости строительства уменьшает каждый материал постройки, включая [постройки]({buildings}) мода, не больше чем на {cap}:"
formula = "стоимость = ⌈количество × (1 − снижение)⌉,   снижение не больше {cap}"
notes = "Разборка возвращает только то, что было заплачено. Если {refund} сохранил материалы поставленной постройки, разборка не даёт ничего."

[formula.armour]
title = "Броня"
text = "{term} работает как в Valheim: уменьшает удар на одну и ту же долю для всех его типов урона, сильно против слабых ударов и слабее против сильных. Где урон удара — сумма его типов урона:"
formula = "броня < урон ÷ 2:   получено = урон − броня;     иначе:   получено = урон² ÷ (4 × броня)"
effective = "броня против существ = ваша броня × {effect} × (1 + увеличения эффективности брони) − пробивание брони существа"
eff_plain = "эффективности брони"
notes = "Броня действует после рунного щита и блока. Существа игнорируют её часть: см. [пробивание врагов]({pen}). Получаемый урон по броне и удару:"
armour_col = "Броня"
hit_col = "Удар {n}"

[formula.item-level]
title = "Уровень предмета"
text = "Выпавший предмет получает уровень существа, с которого выпал (внутри арены со своим уровнем — уровень арены), или биома сундука ([уровни областей]({areas}))."
crafted = "Уровень созданного предмета — наибольший уровень среди его материалов, по биому, откуда они, и не ниже уровня станции, на которой его делают (ниже). Материалы, нужные рецепту только для улучшений, не считаются, камни улучшения тоже. Формы считаются Глубоким Севером. У каждого [базового предмета]({bases}) указан свой. Этот уровень используется, когда руны добавляют предмету свойства: каждая руна задаёт его заново по рецепту."
stations = "Какой уровень самое меньшее даёт каждая станция:"
station_col = "Станция"
glyph = "Каждый «{glyph}», применённый к предмету, прибавляет {n} уровней, до уровня Глубокого Севера ({cap})."
gates = "Уровень предмета определяет, какие [свойства]({mods}) и ступени могут выпасть (у каждой ступени свой диапазон уровней; ступени с 1-й по 3-ю по уровню не выпадают), насколько редкой будет добыча и какие [уникальные предметы]({uniques}) могут выпасть."
ascended = "У [возвышенного]({asc}) предмета уровень не ниже уровня его нового биома."

[formula.experience-falloff]
title = "Угасание опыта"
text = "За пределами рекомендуемого диапазона биома боевой опыт, полученный там, угасает. Диапазоны следуют рекомендуемым уровням игрока (настройка сервера, по умолчанию — уровни биомов). Считается ваш уровень; биом — там, где умирает существо (для убийств) или где стоите вы (для ударов). Быть ниже уровня биома ничего не стоит."
formula = "остаётся = max({floor}, {floor} ^ (уровней за диапазоном ÷ {gap}))"
notes = "Опыт угасает до {floor} через {gap} уровней за диапазоном и ниже не опускается:"
over_col = "Уровней за диапазоном"
share_col = "Остаётся опыта"
full_col = "Полный опыт"
floor_col = "{floor} с уровня"

[formula.ally-kills]
title = "Убийства союзниками"
text = "Убийство союзником — приспешником ({minions}), питомцем ({pets}) или компаньоном — даёт {share} опыта обычного убийства, который делится между игроками рядом, как за любое убийство (для боссов радиус × {boss}). Если вы сами били существо в последние {recent} с, вы получаете обычное убийство."

[formula.player-levels]
title = "Уровень персонажа"
text = "Боевой опыт поднимает уровень персонажа, до {max}. Каждый уровень требует:"
formula = "опыт до следующего уровня = {base} × уровень ^ {exp}, с округлением"
next_col = "До следующего уровня"
