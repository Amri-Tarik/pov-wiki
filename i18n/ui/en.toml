# Halls of Oaths: maps built from room items (halls_pages.py).
[halls]
title = "Halls of Oaths"
how = "How the halls work"
intro = "The Halls of Oaths are dungeons you plan yourself. At a gate of the halls you lay [room items]({rooms}) on the board of the Book of the Halls, pack them into a map, enchant it with runes for [map modifiers]({modifiers}) and launch it. The dungeon is built exactly as planned, and its final boss gives a pair of ascension points."
gates = "Gates and lobbies"
gates_text = "Gates of the Halls of Oaths stand in the world. A gate's level is the level of the land around it: it sets the size of the board, the level of the enemies and the tier of the map. Use a gate to enter its lobby, or hold the alternative key (Shift) while using it for a lobby of your own."
lobby_text = "The lobby is a safe hall in the style of the gate's biome. It holds the {book}, the room merchant {merchant} and the great door into the dungeon."
hugin = "Hugin waits above the book with {n} hints:"
book_title = "The {book}"
board_text = "The book lays a board of cells. The entrance is in the bottom row, and the final boss's cell is the only cell of the top row; the other cells are open or closed at random, and every board can be walked from the entrance to the cell under the boss. The number of open cells grows with the gate's level:"
board_formula = "open cells = {low} at gate level {from_} or lower, rising evenly to {high} at level {to}; the board is as wide as √(cells ÷ {open}), rounded"
gate_biome = "Gate in"
level = "Level"
cells = "Open cells"
board_size = "Board (width × height)"
min_path = "Shortest way at least"
board_rules = "A map holds at most {max} rooms, its boss room included. The top cell takes only a boss room, of any biome, and a map can't be packed without one. Every room must connect to the entrance, and the shortest way from the entrance to the boss must be at least as long as shown."
placing = "Rooms go on open cells from your own bag: pick up a room and click a cell (a stack is taken whole, each click lays one). Right-click takes a room back to the bag, and dropping another room on it replaces it. Neighbouring rooms join by themselves: {shapes}. When a room can't go on a cell or the board has a problem, the book says why. A new board returns the rooms on the old one to the bag."
packing = "Packing turns the placed rooms into a map in the book's cell: the rooms are spent, the plan no longer changes, and the map stays in its cell (it can't be taken out, moved or given away). Until it is launched, a packed map can be enchanted with runes for [map modifiers]({modifiers})."
launch = "Launching"
launch_text = "The map is launched from the book. Every player within {range} m of whoever launches it goes in as one party: the great door rises and the party walks into the dungeon. The dungeon is built exactly as the rooms lie on the board, each room in the architecture and atmosphere of its biome, with enemies of its biome scaled to the gate's level. While the halls are open the map can't be changed; a new map can be launched once the last player is out and the door has come down."
fights = "Sealed fights"
fights_text = "A fight room seals while its fight lasts and opens once it is cleared. Party members can always join a sealed room, and the fight grows for each one who comes in."
fights_numbers = "For one player a room holds {mobs} enemies in all, reinforcements included, with up to {wave} alive at once, plus {elites} elites. Each more player in the room adds {more}% to both counts, one more elite for every {elite_per} more players, and {hp}% health to every enemy ({boss_hp}% to bosses). A room never has more than {cap} enemies alive at once."
fights_stars = "Elites have {elite} star, with a {chance}% chance of one more. The final boss has {boss} more stars, plus those of [Crowned Guardian]({crowned}); [Rising Host]({host}) adds its stars to every enemy."
final = "The final boss"
final_text = "The boss room in the top cell sets the final boss: the boss of its biome at full size, in a tall arena of its biome at the top of the map. After the fight the ascension altar wakes in the arena and a portal leads back to the lobby. Boss rooms on other cells are extra boss fights with their own loot (see [boss rooms]({rooms}))."
deaths = "Deaths"
deaths_text = "A player who falls in the halls respawns in their lobby, not at their bed, and their grave lies in the lobby; these halls stay closed to them for good. The run fails when every member of the party has fallen."
deaths_single = "With a [single life]({link}), a death in the halls is not a real death: the character is not lost."
ascension = "Ascension points"
points_text = "A map's final boss gives a pair of ascension points ({per}) for the map's tier, once per character for each tier: {total} points from the four tiers in all. A map's tier is its gate's tier, by the gate's level; gates below the first tier give none. The points are taken at the ascension altar, where you also choose your class: see [Ascendancy]({ascendancy}). Under the launch button the book shows whether the map will give you points."
points_who = "Only those who stood to the end take the pair: the party members still alive when the boss falls, and those who fell in the boss's own arena."
tier = "Tier"
gate_level = "Gate level"
gate_biomes = "Gates in"
points = "Ascension points"
merchant = "The room merchant"
merchant_text = "{name} stands in the lobby and sells [room items]({rooms}): {count} offers, drawn with the rooms' drop weights from the ordinary and boss rooms the gate's level reaches (a biome boss's room only once that boss has fallen in the world). Unique rooms are never for sale. His stock renews every {days} in-game days."
merchant_renew = "A {rune} renews his stock at once: right-click it in the bag while his shop is open."
room_biome = "Room of"
price = "Price (coins)"
rooms_title = "Room items"
rooms_intro = "Room items are the rooms you lay on the board of the [Book of the Halls]({halls}). Any room goes on any map: its biome decides where it drops, the architecture it is built in and the enemies that hold it. Ordinary and boss rooms stack up to {stack}; unique rooms don't stack."
rooms_drops_title = "Where rooms drop"
rooms_drops = "Room items drop like [currency]({currency}) from creatures and chests: their family competes with the other currency families by the total weight of the rooms that can drop at that spot, and the rarer the drop, the more it favours boss and unique rooms. A room drops only where its row allows it: in its biome, from a land level on, from elite enemies and bosses, or once a biome's boss has fallen in the world. Creatures inside the halls never drop room items."
rooms_boost = "On top of that, every kill and chest outside the halls rolls extra room items: on average {boost} × as many as its currency drops give rooms, picked by the rooms' weights alone (not by rarity). Rooms so drop about {x} times as often as their share of the currency gives."
types = "Room types"
type = "Type"
contains = "What it holds"
room = "Room"
drops_in = "Drops"
weight = "Weight"
drops_biome = "in the {biome}"
drops_from = "anywhere from level {level} ({biome})"
drops_kinds = "from {kinds}"
and = " and "
drops_defeated = "once {boss} has fallen in this world"
not_sold = "not sold"
boss_rooms_text = "In the top cell a boss room holds the map's [final boss]({final}); on any other cell it is an extra boss fight with its own loot that never gives ascension points. The rooms of the halls' own bosses need no defeated boss: they drop anywhere from their land's level."
boss = "Boss"
arena = "Arena"
uniques = "Unique rooms"
uniques_text = "Unique rooms have rules of their own. They drop from elite enemies and bosses anywhere from their land's level, are never sold and don't stack."
see_modifiers = "See also [map modifiers]({link})."
mods_title = "Map modifiers"
mods_intro = "A map packed in the [Book of the Halls]({halls}) can be enchanted with runes for modifiers. Each modifier gives a reward, most of them with a danger attached. Higher-level maps roll stronger modifiers."
grades = "Grades and runes"
grades_text = "A map's grade follows the number of its modifiers; a map holds at most {max}. A modifier family appears only once on a map, and some modifiers need a room type or a boss on the map."
grade = "Grade"
modifiers = "Modifiers"
runes = "Runes on a map"
runes_text = "Runes are applied as on items: right-click the rune in the bag, then click the map in the book. They act only on a packed map before it is launched. A rune that can't act on the map, and any other rune, is refused and not spent."
rune_col = "Rune"
on_map = "On a map"
rolls = "How a modifier rolls"
rolls_text = "A new modifier is picked by weight among those that fit the map. Its tier is then picked among the tiers the map's level reaches, by the tier weights below, and it gets a roll from 0 to 1: its numbers lie between the next tier's and its own tier's, by the roll (for the lowest tier, between {floor}% of its numbers and its numbers). Counts such as item racks or rune mines are rounded to whole numbers; stars and bosses take their tier's number."
min_level = "Map level"
tier_weight = "Tier weight"
mods_list = "Modifiers"
