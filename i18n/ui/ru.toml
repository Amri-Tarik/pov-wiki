projectile = "{proj}: увеличения урона снарядов тоже входят в сумму, вместе с увеличениями скорости снарядов, которые ваши характеристики превращают в урон; так же и увеличения урона факела ({torch})."
ammo = "Луки и арбалеты делят каждый выстрел на две части. Доля боеприпаса — его урон ÷ (урон оружия + урон боеприпаса), без рубящего и добывающего урона у обоих. Эта часть берёт сумму без увеличений урона лука или арбалета, но с вашими увеличениями урона снарядов (включая снаряды лука или арбалета) и увеличениями её типа урона для выстрелов из лука или арбалета (как у колчана); часть оружия берёт сумму как есть, без них."
