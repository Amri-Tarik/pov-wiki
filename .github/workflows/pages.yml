name: Build and deploy wiki

# Manual only while the wiki is under construction: Actions > Build and deploy wiki > Run workflow
# (or `gh workflow run pages.yml`). To re-enable automatic deploys, add back:
#   push: {branches: [main]}
#   schedule: [{cron: "17 6 * * *"}]   # daily, picks up new mod releases from hexium
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run povwiki fetch
      - run: uv run povwiki build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
