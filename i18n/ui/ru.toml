min_path = "Кратчайший путь не короче"
board_rules = "На карте не больше {max} комнат, считая комнату босса. В верхнюю клетку ставится только комната босса, любого биома, и без неё карту не упаковать. Каждая комната должна соединяться со входом, а кратчайший путь от входа до босса должен быть не короче указанного."
placing = "Комнаты ставятся на открытые клетки из вашей сумки: возьмите комнату и щёлкните по клетке (стопка берётся целиком, каждый щелчок кладёт одну). Правый щелчок возвращает комнату в сумку, а другая комната, брошенная на неё, её заменяет. Соседние комнаты соединяются сами: {shapes}. Если комнату нельзя поставить на клетку или с доской что-то не так, книга объясняет почему. Новая доска возвращает комнаты со старой в сумку."
